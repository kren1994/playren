<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f3efe6">
    <script>
        // Apply the chosen color scheme before first paint (no flash).
        // Default is light; options are light / gray / dark (no OS auto-follow).
        try {
            const saved = JSON.parse(localStorage.getItem('playren:user-settings') || 'null');
            const scheme = saved && ['light', 'gray', 'dark'].includes(saved.colorScheme) ? saved.colorScheme : 'light';
            document.documentElement.dataset.theme = scheme;
            const meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.content = { light: '#f3efe6', gray: '#2a241d', dark: '#1a1613' }[scheme];
        } catch (error) { /* first visit */ }
    </script>
    <title>playren | 対局所</title>
    <style>
        :root {
            --bg: #f3efe6;
            --bg-accent: #e8ddc9;
            --bg-glow: rgba(255, 255, 255, 0.68);
            --panel: rgba(255, 252, 246, 0.88);
            --panel-strong: #fffaf1;
            --overlay: rgba(255, 252, 246, 0.65);
            --backdrop: rgba(0, 0, 0, 0.05);
            --line: rgba(74, 54, 34, 0.18);
            --hairline: rgba(74, 54, 34, 0.1);
            --field: rgba(255, 255, 255, 0.85);
            --field-line: rgba(74, 54, 34, 0.12);
            --fill-soft: rgba(74, 54, 34, 0.055);
            --tint-hover: rgba(23, 89, 74, 0.07);
            --tint-active: rgba(23, 89, 74, 0.12);
            --tint-state: rgba(23, 89, 74, 0.08);
            --focus-ring: rgba(23, 89, 74, 0.45);
            --text: #2f2418;
            --muted: #7b6855;
            --accent: #17594a;
            --accent-strong: #0f4338;
            --accent-soft: rgba(23, 89, 74, 0.12);
            --warn: #a44b1f;
            --danger: #8b2f28;
            --shadow-color: rgba(63, 43, 21, 0.2);
            --toast-bg: rgba(32, 26, 20, 0.9);
            --toast-text: #f8f5ef;
            --board-dim: none;
            --stone-black-rim: rgba(47, 36, 24, 0.25);
            --stone-white-rim: rgba(74, 54, 34, 0.35);
            --shadow: 0 24px 60px rgba(63, 43, 21, 0.14);
            --radius-xl: 28px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 10px;
            --shell-padding: clamp(10px, 2vw, 18px);
            color: var(--text);
            font-family: "Yu Gothic UI", "Hiragino Sans", Meiryo, sans-serif;
        }

        /* 夜の和紙: dark charcoal paper; the wood board stays light and
           becomes the single bright object in the room. Applied when the OS
           prefers dark (unless the user forced light), or when forced dark. */
        /* Manual color scheme only (no OS auto-follow):
           gray = warm dark paper, dark = deeper near-black. */
        :root[data-theme="gray"] {
                --bg: #2a241d;
                --bg-accent: #332c22;
                --bg-glow: rgba(255, 244, 224, 0.06);
                --panel: rgba(54, 47, 38, 0.92);
                --panel-strong: #3a3228;
                --overlay: rgba(50, 43, 34, 0.9);
                --backdrop: rgba(0, 0, 0, 0.35);
                --line: rgba(236, 224, 202, 0.18);
                --hairline: rgba(236, 224, 202, 0.14);
                --field: rgba(255, 255, 255, 0.08);
                --field-line: rgba(236, 224, 202, 0.18);
                --fill-soft: rgba(236, 224, 202, 0.08);
                --tint-hover: rgba(99, 199, 170, 0.09);
                --tint-active: rgba(99, 199, 170, 0.16);
                --tint-state: rgba(99, 199, 170, 0.13);
                --focus-ring: rgba(99, 199, 170, 0.5);
                --text: #ece3d3;
                --muted: #b0a189;
                --accent: #46a98c;
                --accent-strong: #63c7aa;
                --accent-soft: rgba(99, 199, 170, 0.16);
                --warn: #d98f52;
                --danger: #e0796a;
                --shadow-color: rgba(0, 0, 0, 0.5);
                --toast-bg: rgba(24, 20, 16, 0.95);
                --toast-text: #f0e8da;
                --board-dim: brightness(0.96);
                --stone-black-rim: rgba(233, 218, 191, 0.4);
                --stone-white-rim: rgba(233, 218, 191, 0.2);
                --shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        :root[data-theme="dark"] {
                --bg: #1a1613;
                --bg-accent: #231d16;
                --bg-glow: rgba(255, 244, 224, 0.05);
                --panel: rgba(38, 32, 25, 0.92);
                --panel-strong: #2a231b;
                --overlay: rgba(34, 28, 22, 0.85);
                --backdrop: rgba(0, 0, 0, 0.35);
                --line: rgba(233, 218, 191, 0.16);
                --hairline: rgba(233, 218, 191, 0.12);
                --field: rgba(255, 255, 255, 0.07);
                --field-line: rgba(233, 218, 191, 0.16);
                --fill-soft: rgba(233, 218, 191, 0.07);
                --tint-hover: rgba(99, 199, 170, 0.09);
                --tint-active: rgba(99, 199, 170, 0.16);
                --tint-state: rgba(99, 199, 170, 0.13);
                --focus-ring: rgba(99, 199, 170, 0.5);
                --text: #ece3d3;
                --muted: #a3947d;
                --accent: #46a98c;
                --accent-strong: #63c7aa;
                --accent-soft: rgba(99, 199, 170, 0.16);
                --warn: #d98f52;
                --danger: #e0796a;
                --shadow-color: rgba(0, 0, 0, 0.5);
                --toast-bg: rgba(24, 20, 16, 0.95);
                --toast-text: #f0e8da;
                --board-dim: brightness(0.93);
                --stone-black-rim: rgba(233, 218, 191, 0.4);
                --stone-white-rim: rgba(233, 218, 191, 0.2);
                --shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
        }

        html {
            -webkit-touch-callout: none;
            -webkit-font-smoothing: antialiased;
            /* Solid canvas colour so overscroll / rubber-band areas beyond the
               body gradient never flash white (glaring in dark mode). */
            background: var(--bg-accent);
        }

        /* Keyboard focus: one consistent accent ring app-wide. */
        :focus-visible {
            outline: 2px solid var(--focus-ring);
            outline-offset: 2px;
        }

        /* Motion preference is honored at each animation's declaration site:
           decorative animations are gated behind (prefers-reduced-motion:
           no-preference). Do NOT add a universal `* { transition-duration }`
           override here — transition-property defaults to `all`, so it turns
           every layout change into a (tiny) async transition and breaks
           resizeBoard's measurements while crossing breakpoints. */
        
        body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top, var(--bg-glow), transparent 42%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-accent) 100%);
            background-color: var(--bg-accent);
            padding: clamp(6px, 1.8vw, 18px);
            box-sizing: border-box;
            overscroll-behavior-y: none;
        }

        .app-shell {
            width: min(100%, 1320px);
            margin: 0 auto;
            padding: var(--shell-padding);
            border-radius: 32px;
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        .screen[hidden] {
            display: none !important;
        }

        /* Lobby: one vertically centered composition — board mark, wordmark,
           title, then the join card. No chrome it doesn't need. */
        .lobby-screen {
            position: relative;
            min-height: calc(100dvh - 2 * var(--shell-padding) - 2 * clamp(6px, 1.8vw, 18px));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(22px, 4vh, 34px);
            padding-bottom: 4vh; /* slight lift: optical centre sits above true centre */
            box-sizing: border-box;
        }

        .lobby-hero {
            display: grid;
            justify-items: center;
            gap: 6px;
            text-align: center;
        }

        .lobby-board {
            width: clamp(76px, 12vw, 92px);
            height: auto;
            margin-bottom: 12px;
            filter: drop-shadow(0 14px 26px var(--shadow-color));
        }

        .lobby-title {
            margin: 0;
            font-size: clamp(32px, 5vw, 42px);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: 0.14em;
            text-indent: 0.14em; /* re-center: letter-spacing adds a trailing gap */
        }

        /* Small wordmark above the title: quiet brand identity. */
        .lobby-kicker {
            margin: 0;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.34em;
            text-indent: 0.34em;
            text-transform: lowercase;
            color: var(--muted);
        }

        /* Gentle rise-in when the lobby appears. */
        @media (prefers-reduced-motion: no-preference) {
            .lobby-hero,
            .lobby-grid .panel {
                animation: lobby-rise 0.45s cubic-bezier(0.2, 0.7, 0.3, 1) backwards;
            }

            .lobby-grid .panel {
                animation-delay: 0.08s;
            }

            @keyframes lobby-rise {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
            }
        }

        /* Corner controls (color scheme + language) share the top-right. */
        .lobby-corner {
            position: absolute;
            top: 4px;
            right: 4px;
            display: flex;
            gap: 8px;
        }

        .lobby-corner .lobby-lang-btn {
            position: static;
        }

        .scheme-icon {
            width: 17px;
            height: 17px;
            flex: 0 0 auto;
        }

        /* Ghost buttons in the control-bar idiom: no box at rest, a soft
           tint on hover. */
        .lobby-lang-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            min-width: 42px;
            height: 42px;
            padding: 0 12px;
            border: 0;
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            touch-action: manipulation;
            user-select: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.18s ease, color 0.18s ease;
        }

        @media (hover: hover) {
        .lobby-lang-btn:hover {
            background: var(--tint-hover);
            color: var(--text);
        }
        }
        .lobby-lang-btn:active {
            background: var(--tint-active);
        }

        .language-icon {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
        }

        .language-code {
            min-width: 2.2em;
            text-align: left;
            letter-spacing: 0;
        }

        .lobby-grid {
            display: flex;
            justify-content: center;
        }
        
        .lobby-grid {
            width: 100%;
        }

        .lobby-grid .panel {
            width: 100%;
            max-width: 372px;
            padding: 22px 22px 16px;
        }

        .lobby-help {
            margin-top: 14px;
            text-align: center;
        }

        .lobby-help-link {
            display: inline-block;
            font-size: 13px;
            color: var(--accent-strong);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        @media (hover: hover) {
        .lobby-help-link:hover {
            opacity: 0.8;
        }
        }

        .game-screen {
            display: grid;
            gap: 14px;
        }

        /* Opacity-only fade when entering the room (transform would disturb
           the board-size measurement on first layout). */
        @media (prefers-reduced-motion: no-preference) {
            .game-screen {
                animation: screen-fade 0.3s ease;
            }

            @keyframes screen-fade {
                from { opacity: 0; }
            }
        }

        .game-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        /* Paper-flat: the page background IS the surface. Panels and cards
           keep only their layout role; floating layers (menus, dialogs,
           toasts, chips) are the only elements that carry their own surface. */
        .panel,
        .card {
            border: 0;
            background: transparent;
        }

        .player-name,
        .section-title,
        .control-main {
            display: block;
            font-weight: 700;
            min-height: 1.5em; 
        }

        .player-meta,
        .card p,
        .game-kicker {
            color: var(--muted);
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1.55fr) minmax(320px, 0.95fr);
            gap: 18px;
        }

        .panel {
            padding: 16px;
            border-radius: var(--radius-xl);
            min-width: 0;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        .field label,
        .card h2 {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        /* The lobby is one centered axis (icon → title → button); the form
           joins it — labels and the short inputs read fine centered. */
        .lobby-grid .field label {
            text-align: center;
            /* muted so the typed values, not the labels, carry the weight */
            color: var(--muted);
            font-weight: 600;
        }

        .lobby-grid .field input {
            text-align: center;
        }

        /* Same idiom as the chat compose pill: borderless soft fill, a ring
           only when focused — the form sits IN the paper, not on it. */
        .field input {
            width: 100%;
            min-height: 46px;
            padding: 12px 16px;
            border-radius: 999px;
            border: 0;
            background: var(--fill-soft);
            color: var(--text);
            box-sizing: border-box;
            transition: background 0.18s ease, box-shadow 0.18s ease;
        }

        .field input:focus {
            outline: none;
            background: var(--panel-strong);
            box-shadow: inset 0 0 0 1px var(--focus-ring);
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .button {
            min-height: 48px;
            padding: 0 16px;
            border-radius: 14px;
            font-weight: 700;
            transition: transform 0.18s ease, opacity 0.18s ease, background 0.18s ease;
            cursor: pointer;
            border: none;
        }

        @media (hover: hover) {
        .button:hover {
            transform: translateY(-1px);
        }
        }

        .button:active {
            transform: translateY(0) scale(0.985);
        }

        .button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .button-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #f9fbf8;
            box-shadow: 0 4px 14px rgba(15, 67, 56, 0.22);
        }

        @media (hover: hover) {
        .button-primary:hover {
            box-shadow: 0 7px 18px rgba(15, 67, 56, 0.26);
        }
        }

        .button-primary:active {
            box-shadow: 0 2px 8px rgba(15, 67, 56, 0.2);
        }

        .button-secondary {
            background: var(--field);
            color: var(--text);
            border: 1px solid var(--field-line);
        }

        .button-warn {
            background: rgba(164, 75, 31, 0.1);
            color: var(--warn);
            border: 1px solid rgba(164, 75, 31, 0.18);
        }

        /* Seats form a flat strip in the control-bar grammar: no boxes, one
           inset hairline between the black and white seats. Both strips hug
           the board's actual width (published by resizeBoard). */
        .players {
            /* One fluid scale driven by the board's real width — replaces the
               per-breakpoint hand-tuned sizes that drifted apart over time. */
            --seat-dot: clamp(8px, calc(var(--board-size, 600px) * 0.016), 11px);
            --seat-name: clamp(12px, calc(var(--board-size, 600px) * 0.022), 15px);
            --seat-timer: clamp(14px, calc(var(--board-size, 600px) * 0.028), 20px);
            --seat-pad-x: 14px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0;
            margin-bottom: 5px;
        }

        .players,
        .board-controls {
            width: min(100%, var(--board-size, 100%));
            margin-left: auto;
            margin-right: auto;
        }

        .players .player-card + .player-card::after {
            content: "";
            position: absolute;
            left: 0;
            top: 18%;
            bottom: 18%;
            width: 1px;
            background: var(--hairline);
        }

        /* The two cards form one strip: square off the shared seam so tints
           read as one surface split by the hairline. */
        .players .player-card:first-child {
            border-radius: var(--radius-md) 0 0 var(--radius-md);
        }

        .players .player-card + .player-card {
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
        }

        /* Outside of play the seats carry a quiet resting fill (same idiom as
           the chat compose pill) so joinable seats stay discoverable. */
        .players.seats-idle .player-card {
            background: var(--fill-soft);
        }

        .player-card {
            padding: 8px var(--seat-pad-x);
            border-radius: var(--radius-md);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        /* State paints the surface: no resting box, a soft tint marks the
           seat whose clock is running. */
        .player-card.active {
            background: var(--tint-state);
        }

        /* Colour swap: both seats flash a brief amber wash that decays — the
           change is announced where it happened (the seats), not on the board. */
        @media (prefers-reduced-motion: no-preference) {
            .player-card.swap-pulse {
                animation: seat-swap-pulse 1.4s ease-out;
            }

            @keyframes seat-swap-pulse {
                from { background-color: rgba(226, 138, 42, 0.24); }
                to { background-color: transparent; }
            }
        }

        @media (prefers-reduced-motion: reduce) {
            /* Motion-free fallback: a short static wash; the card's own
               background transition eases it in and out. */
            .player-card.swap-pulse {
                background-color: rgba(226, 138, 42, 0.16);
            }
        }

        .player-slot {
            width: 100%;
            min-width: 0;
            border-radius: 10px;
        }

        .players.pair-renju .player-slot.active {
            background: var(--tint-state);
        }

        .player-card.seat-action,
        .player-slot.seat-action,
        .spectator-card.seat-action {
            cursor: pointer;
            touch-action: manipulation;
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        /* When "return to spectating" is available, an inset rounded fill
           (same shape language as the compose pill) marks the tappable zone —
           a full-bleed band read too heavy next to the chat's small pill. */
        .spectator-card.seat-action {
            position: relative;
        }

        .spectator-card.seat-action::before {
            content: "";
            position: absolute;
            /* horizontal inset matches the section padding (16px) so the fill
               lines up exactly with the chat compose pill's edges */
            inset: 6px 16px;
            border-radius: 12px;
            background: var(--fill-soft);
            pointer-events: none;
        }

        @media (hover: hover) {
        .spectator-card.seat-action:hover::before {
            background: var(--tint-hover);
        }
        }

        @media (hover: hover) {
        .player-card.seat-action:hover,
        .player-slot.seat-action:hover {
            background: var(--tint-hover);
        }
        }

        .player-card.seat-action:active,
        .player-slot.seat-action:active,
        .spectator-card.seat-action:active {
            transform: translateY(1px);
        }

        .players.pair-renju .player-card {
            align-items: stretch;
        }

        .players.pair-renju .player-team-members {
            display: grid;
            grid-template-rows: repeat(2, minmax(0, 1fr));
            flex: 1;
            min-width: 0;
        }

        .players.pair-renju .player-slot + .player-slot {
            border-top: 1px solid var(--hairline);
            border-radius: 0 0 10px 10px;
        }

        .players.pair-renju .player-head {
            min-height: 34px;
        }

        .players:not(.pair-renju) .player-slot-bottom {
            display: none;
        }

        .player-card.black::before,
        .player-card.white::before {
            content: "";
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: var(--seat-pad-x);
            width: var(--seat-dot);
            height: var(--seat-dot);
            border-radius: 50%;
            /* var-based ring so the black stone dot stays visible on dark paper */
            border: 1px solid var(--line);
            z-index: 1;
        }

        .player-card.black::before {
            background: #26211e;
            /* rim brightens in dark mode so the black dot keeps a silhouette */
            border-color: var(--stone-black-rim);
        }

        .player-card.white::before {
            background: #f8f5ef;
            /* stronger rim in light mode: the white dot is near paper tone */
            border-color: var(--stone-white-rim);
        }

        .player-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            /* clear the stone dot (drawn at the content-box start) + a gap */
            padding-left: calc(var(--seat-dot) + 14px);
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        .player-team-members {
            flex: 1;
            min-width: 0;
        }

        .players.pair-renju .player-timer {
            align-self: center;
        }

        .player-main {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-width: 0;
        }

        .player-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            /* fluid size; the JS fit-guard var only kicks in for long names */
            font-size: var(--mobile-player-name-size, var(--seat-name));
        }

        .player-identity {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            position: relative;
            overflow: visible;
        }

        .player-status {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 2;
            transform: translate(-50%, -50%);
            padding: 4px 8px;
            border: 1px solid var(--field-line);
            border-radius: 999px;
            background: var(--panel-strong);
            box-shadow: 0 3px 10px rgba(32, 26, 20, 0.12);
            color: var(--text);
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
            pointer-events: none;
        }

        /* Disconnected seated player: just lightly grey the name (the match
           keeps running; the clock and the grey name are the only cues). */
        .player-slot.disconnected .player-name {
            opacity: 0.5;
        }

        /* Turn marker: a hairline under the name of whoever is to move. Rides
           on text-decoration so it tracks the name's ellipsised width, and
           stays clear of .disconnected (opacity), so both can show at once. */
        .player-slot.active .player-name {
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-decoration-color: var(--muted);
            text-underline-offset: 3px;
        }

        /* ...and it goes accent only when that someone is me. The line says
           WHO moves, the colour says whether that's you — so accent keeps
           meaning "you can act", as it does on buttons and focus rings.
           Colour only, no new element and no motion. */
        .player-slot.self.active .player-name {
            text-decoration-color: var(--accent);
        }

        .player-timer {
            flex: 0 0 auto;
            font-size: var(--seat-timer);
            /* single numeric line: keep its box under the name's 1.5em core so
               the clock appearing/disappearing never changes the row height */
            line-height: 1;
            font-weight: 800;
            /* tabular-nums already meters the digits; no negative tracking */
            letter-spacing: 0;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s ease;
        }

        /* Time pressure: amber under 10s, red under 5s. Colour only — no
           blinking, so a player under pressure can stay focused on the board. */
        .player-timer.time-low {
            color: var(--warn);
        }

        .player-timer.time-critical {
            color: var(--danger);
        }


        .player-ready {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            align-self: center;
            flex: 0 0 18px;
            width: 18px;
            height: 18px;
        }

        /* No mark → no slot: give the reserved width back to the name. */
        .player-ready:empty {
            display: none;
        }

        .ready-mark {
            flex: 0 0 18px;
            width: 18px;
            height: 18px;
            aspect-ratio: 1;
            box-sizing: border-box;
            border-radius: 50%;
            border: 1px solid var(--field-line);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            line-height: 1;
            font-weight: 800;
            color: rgba(47, 36, 24, 0.32);
            background: var(--field);
        }

        .ready-mark.passive {
            opacity: 0.72;
        }

        .ready-mark.active {
            color: #f8fbf8;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            border-color: rgba(23, 89, 74, 0.42);
        }

        /* 透過ダイアログのスタイル */
        .confirm-backdrop {
            position: fixed;
            inset: 0;
            padding: 20px;
            background: var(--backdrop);
            z-index: 30;
        }

        @media (prefers-reduced-motion: no-preference) {
            .confirm-backdrop {
                animation: dialog-fade 0.16s ease-out;
            }

            /* Opacity only: the card is positioned via transform, so animating
               transform here would knock it out of place. */
            @keyframes dialog-fade {
                from { opacity: 0; }
            }
        }

        /* Non-modal variant for in-game responses (swap / draw / takeback /
           resign): the card floats but the page stays fully usable, so the
           player can review the position or chat before answering. Board
           moves during a swap phase are legal and imply "keep". */
        .confirm-backdrop.confirm-passive {
            background: transparent;
            pointer-events: none;
        }

        .confirm-backdrop.confirm-passive .confirm-card {
            pointer-events: auto;
        }

        .confirm-card {
            width: auto;
            min-width: 240px;
            max-width: min(100%, 360px);
            padding: 16px;
            border-radius: 20px;
            border: 1px solid var(--hairline);
            background: var(--overlay);
            backdrop-filter: blur(2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: grid;
            gap: 14px;
            position: fixed;
            left: var(--confirm-dialog-x, 50vw);
            top: var(--confirm-dialog-y, 50vh);
            transform: translate(-50%, -100%);
        }

        .confirm-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .confirm-message {
            margin: 0;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-line; /* honor the \n line break in the message */
        }

        /* 「そのまま」はボタンでなく盤への着手なので、その導線を一言で示す */
        .confirm-hint {
            margin: -4px 0 0;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }

        #timeSettingsDialog {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
            overscroll-behavior: contain;
        }

        #timeSettingsDialog[hidden] {
            display: none;
        }

        .time-settings-card {
            width: max-content;
            min-width: 0;
            max-width: calc(100vw - 24px);
            max-height: calc(100vh - 24px);
            max-height: calc(100dvh - 24px);
            padding: 16px;
            background: var(--panel-strong);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
            overflow-y: auto;
            overscroll-behavior: contain;
            position: relative;
            left: auto;
            top: auto;
            transform: none;
        }

        .time-settings-form {
            display: grid;
            gap: 14px;
        }

        .time-handicap-row {
            width: fit-content;
            min-height: 24px;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
        }

        .time-handicap-row input {
            width: 12px;
            height: 12px;
            margin: 0;
            accent-color: var(--accent);
        }

        .time-seat-grid {
            display: grid;
            grid-template-columns: max-content max-content max-content;
            align-items: center;
            gap: 10px 12px;
            position: relative;
        }

        .time-seat-grid.single {
            grid-template-columns: max-content max-content;
        }

        .time-seat-grid.single .time-control-cell {
            grid-column: 2;
        }

        .time-seat-grid.single .time-base-label,
        .time-seat-grid.single .time-base-control {
            grid-row: 1;
        }

        .time-seat-grid.single .time-increment-label,
        .time-seat-grid.single .time-increment-control {
            grid-row: 2;
        }

        .time-seat-divider {
            position: absolute;
            left: var(--time-divider-x, 50%);
            top: 0;
            bottom: 0;
            width: 1px;
            transform: translateX(-0.5px);
            background: var(--field-line);
            pointer-events: none;
        }

        .time-seat-grid.single .time-seat-divider {
            display: none;
        }

        .time-seat-title {
            grid-row: 1;
            text-align: center;
            font-size: 12px;
            font-weight: 800;
            color: var(--text);
        }

        #uiTimeLeftLabel {
            grid-column: 2;
        }

        #uiTimeRightLabel {
            grid-column: 3;
        }

        .time-row-label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .time-base-label,
        .time-base-control {
            grid-row: 2;
        }

        .time-increment-label,
        .time-increment-control {
            grid-row: 3;
        }

        .time-row-label {
            grid-column: 1;
        }

        .time-left-control {
            grid-column: 2;
        }

        .time-right-control {
            grid-column: 3;
        }

        .time-stepper {
            display: grid;
            grid-template-columns: 30px 4em 30px auto;
            align-items: center;
            justify-content: start;
            column-gap: 3px;
        }

        .time-stepper input {
            width: 100%;
            max-width: none;
            min-height: 34px;
            padding: 6px 10px 6px 3px;
            border-radius: 10px;
            border: 1px solid var(--field-line);
            background: var(--field);
            color: var(--text);
            box-sizing: border-box;
            text-align: right;
            font-weight: 700;
            appearance: textfield;
        }

        .time-stepper input::-webkit-inner-spin-button,
        .time-stepper input::-webkit-outer-spin-button {
            margin: 0;
            appearance: none;
        }

        .time-step-button {
            width: 30px;
            height: 34px;
            padding: 0;
            border-radius: 10px;
            border: 1px solid var(--field-line);
            background: var(--field);
            color: var(--text);
            font-size: 18px;
            font-family: inherit;
            line-height: 1;
            font-weight: 500;
            cursor: pointer;
            touch-action: manipulation;
        }

        .time-step-button:active {
            background: var(--tint-active);
        }

        .time-step-button:disabled {
            cursor: not-allowed;
            opacity: 0.4;
        }

        .time-unit {
            margin-left: 6px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            min-width: 1.8em;
        }

        .time-settings-card > .confirm-actions {
            justify-content: flex-end;
            padding-top: 12px;
            border-top: 1px solid var(--hairline);
        }

        @media (max-width: 480px) {
            .time-seat-grid {
                grid-template-columns: repeat(2, max-content);
                gap: 7px 8px;
            }

            .time-base-label {
                grid-column: 1 / -1;
                grid-row: 2;
            }

            .time-base-control {
                grid-row: 3;
            }

            .time-increment-label {
                grid-column: 1 / -1;
                grid-row: 4;
            }

            .time-increment-control {
                grid-row: 5;
            }

            .time-seat-grid.single {
                grid-template-columns: max-content;
            }

            .time-seat-grid.single .time-row-label,
            .time-seat-grid.single .time-control-cell {
                grid-column: 1;
            }

            .time-seat-grid.single .time-base-label {
                grid-row: 1;
            }

            .time-seat-grid.single .time-base-control {
                grid-row: 2;
            }

            .time-seat-grid.single .time-increment-label {
                grid-row: 3;
            }

            .time-seat-grid.single .time-increment-control {
                grid-row: 4;
            }
        }

        @media (max-width: 340px) {
            .time-settings-card {
                padding: 12px;
            }

            .time-seat-grid {
                gap: 8px 6px;
            }

            .time-stepper {
                grid-template-columns: 28px 3.6em 28px auto;
            }

            .time-stepper input {
                width: 100%;
                max-width: none;
            }

            .time-step-button {
                width: 28px;
            }

            .time-unit {
                min-width: 1.4em;
            }
        }

        /* 盤面コンテナ（歪み防止の核） */
        .board-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        /* The board is the one raised object on the page: a plank resting on
           paper, same idiom as the lobby mark. */
        .board-wrap {
            position: relative;
            border-radius: 6px;
            overflow: visible;
            padding: 0;
            box-sizing: border-box;
            background: transparent;
            box-shadow: 0 16px 40px var(--shadow-color);
        }

        /* Transient notice floated over the board (e.g. an opening swap):
           lands in the player's line of sight, then fades away. Sits in the
           lower area because opening stones cluster around the centre.
           Opacity-only, so no reduced-motion gate. */
        .board-notice {
            position: absolute;
            left: 50%;
            top: 72%;
            transform: translate(-50%, -50%);
            max-width: calc(100% - 32px);
            padding: 10px 18px;
            border-radius: 999px;
            background: var(--toast-bg);
            color: var(--toast-text);
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 6;
        }

        .board-notice.show {
            opacity: 1;
        }

        #boardCanvas {
            filter: var(--board-dim);
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 6px;
            cursor: pointer;
            touch-action: none; /* ズーム等を防ぐ */
        }

        .board-controls {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: 8px;
            box-sizing: border-box;
            align-items: center;
            margin-top: 5px;
            /* Slim vertical padding: the buttons absorb it as tap height, so
               the bar's outer height stays what it was with boxed buttons.
               No box of its own — hairline segments floating under the board. */
            padding: 4px 8px;
            background: transparent;
            border: 0;
            border-radius: var(--radius-lg);
        }

        .ctrl-left, .ctrl-center, .ctrl-right { display: flex; align-items: center; }
        .ctrl-left, .ctrl-right { gap: 6px; }
        /* Arrows sit edge-to-edge; hairlines (not gaps) separate them. */
        .ctrl-center { gap: 0; justify-content: center; min-width: 0; }
        .control-menu { position: relative; }

        /* Hairlines fencing off the two menus from the arrow group. The
           pseudo-elements become flex items, inset vertically per design. */
        .ctrl-left::after,
        .ctrl-right::before {
            content: "";
            width: 1px;
            align-self: stretch;
            margin: 12px 0;
            background: var(--hairline);
        }
        /* The menu buttons run right up to their hairline: the old 8px gap is
           absorbed as tap width, while padding + alignment keep the icon at
           exactly its previous position. */
        .ctrl-left .menu-icon-btn {
            width: 50px;
            justify-content: flex-start;
            padding-left: 10px;
        }
        .ctrl-right .menu-icon-btn {
            width: 50px;
            justify-content: flex-end;
            padding-right: 10px;
        }

        /* Flat buttons: no box, just a soft tint on hover/press. */
        .board-controls button {
            padding: 10px 12px;
            border: 0;
            background: transparent;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            touch-action: manipulation;
            white-space: nowrap;
            user-select: none;
            color: var(--text);
            transition: background 0.18s ease, transform 0.18s ease;
        }
        @media (hover: hover) { .board-controls button:hover { background: var(--tint-hover); } }
        .board-controls button:active { background: var(--tint-active); transform: scale(0.96); }
        .board-controls button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; background: transparent; }

        /* Hairline between adjacent arrows, vertically inset. */
        .ctrl-center .nav-btn { position: relative; }
        .ctrl-center .nav-btn:not(:last-child)::after {
            content: "";
            position: absolute;
            right: 0;
            top: 25%;
            bottom: 25%;
            width: 1px;
            background: var(--hairline);
        }
        
        .menu-icon-btn {
            width: 42px; height: 50px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
        }
        .menu-icon-btn.active { background: var(--tint-active); color: var(--accent-strong); }
        .control-icon { display: inline-flex; width: 22px; height: 22px; }
        .control-icon svg { width: 100%; height: 100%; fill: currentColor; }
        .control-menu-popup {
            position: absolute; bottom: calc(100% + 8px); min-width: 144px; display: flex; flex-direction: column; gap: 0;
            padding: 5px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel-strong);
            box-shadow: var(--shadow); z-index: 20;
        }
        @media (prefers-reduced-motion: no-preference) {
            .control-menu-popup {
                transform-origin: bottom center;
                animation: menu-pop 0.16s cubic-bezier(0.2, 0.8, 0.3, 1);
            }
            @keyframes menu-pop {
                from { opacity: 0; transform: translateY(5px) scale(0.97); }
            }
        }
        .control-menu-popup[hidden] { display: none !important; }
        .control-menu.align-right .control-menu-popup { right: 0; }
        .control-menu:not(.align-right) .control-menu-popup { left: 0; }
        .control-menu-divider { height: 1px; margin: 4px 10px; background: var(--field-line); }
        .control-menu-divider[hidden] { display: none; }
        
        .board-controls .control-menu-item {
            width: 100%; text-align: left; padding: 12px 14px; font-size: 13px; font-weight: 600;
            color: var(--text); background: transparent; border: none; box-shadow: none; border-radius: 10px; outline: none;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        @media (hover: hover) { .board-controls .control-menu-item:hover { background: var(--tint-hover); transform: none; } }
        .board-controls .control-menu-item:active { background: var(--tint-active); }
        .board-controls .control-menu-item::after { content: ''; width: 1em; flex: 0 0 1em; }
        .board-controls .control-menu-item.active::after { content: '✓'; color: var(--muted); }
        .board-controls .control-menu-item.board-theme-item::after,
        .board-controls .control-menu-item[data-value]::after { content: attr(data-value); width: auto; flex: 0 0 auto; color: var(--muted); }
        .board-controls .control-menu-item.language-menu-item::after { content: none; display: none; }
        .control-menu-value {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-weight: 700;
        }
        .board-controls .language-menu-item .control-menu-value {
            margin-left: auto;
            justify-content: flex-end;
        }
        .board-controls .language-menu-item .language-code {
            min-width: 0;
            text-align: right;
        }
        
        .nav-btn {
            padding: 0; display: inline-flex; align-items: center; justify-content: center;
            text-align: center; line-height: 1; height: 50px;
        }
        /* Step (single move) is tapped the most and gets the widest target;
           reset (jump to latest) sits in between; branch (±4) is narrowest.
           Widths absorb the removed 6px gaps so the group total stays put. */
        .nav-btn.branch { width: 3.8em; letter-spacing: -0.08em; }
        .nav-btn.step { width: 4.9em; }
        .nav-btn.reset { width: 4.1em; }

        .sidebar {
            display: grid;
            gap: 14px;
            align-content: start;
            min-width: 0;
        }

        .card {
            padding: 16px;
            border-radius: var(--radius-xl);
        }

        /* One surface for the whole sidebar: sections separated by hairlines
           and whitespace instead of nested boxes. */
        .card.sidebar-card {
            padding: 0;
            overflow: hidden; /* clip section hover tint to the rounded corners */
        }

        .side-section {
            padding: 14px 16px;
            min-width: 0;
        }

        .side-section + .side-section {
            border-top: 1px solid var(--hairline);
        }

        .card h2 {
            margin: 0 0 12px;
            font-size: 15px;
        }

        .card p {
            margin: 0;
            line-height: 1.65;
            font-size: 14px;
        }

        .info-card {
            display: grid;
            gap: 12px;
        }

        .info-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        #roomSummary {
            padding-left: 12px; /* line up with the chat column's left edge */
            font-size: 13.5px;
        }

        .compact-time-editor {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .compact-time-editor input {
            width: 4.2em;
            min-height: 34px;
            padding: 6px 8px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
        }

        .compact-time-editor span {
            color: var(--muted);
            font-size: 13px;
        }

        .spectator-list {
            list-style: none;
            margin: 0;
            display: grid;
            align-content: start;
            gap: 8px;
            max-height: 88px;
            overflow-y: auto;
            /* same left inset as the chat column, so all sidebar text shares
               one baseline */
            padding: 0 4px 0 12px;
        }

        .spectator-item {
            padding: 3px 0;
            margin: 0;
            font-size: 13.5px;
            box-sizing: border-box;
        }

        /* Empty states are notes, not content — same muted voice as the
           room-info line. */
        .spectator-item--empty {
            color: var(--muted);
        }

        .move-list,
        .log-list {
            list-style: none;
            margin: 0;
            display: grid;
            align-content: start; /* ここで縦に伸びるのを防ぐ */
            gap: 10px;
            max-height: 260px;
            overflow: auto;
            /* left inset lines the chat badges up with the compose badge */
            padding: 0 4px 0 12px;
        }

        /* While older messages continue below the fold, melt the cut edge
           instead of cropping mid-line (class managed by updateLogFade). */
        .log-list--fade {
            -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 24px), transparent);
            mask-image: linear-gradient(to bottom, #000 calc(100% - 24px), transparent);
        }

        /* Quiet scrollbars, desktop only: invisible at rest, a hairline thumb
           while the pointer is over the list (wheel-scrolling implies hover).
           Touch devices keep their native auto-hiding overlay bars. Standard
           properties serve Chrome/Firefox; the -webkit rules cover older
           Safari, which ignores scrollbar-color. */
        @media (hover: hover) and (pointer: fine) {
            .log-list,
            .spectator-list,
            .sidebar {
                scrollbar-width: thin;
                scrollbar-color: transparent transparent;
            }

            .log-list:hover,
            .spectator-list:hover,
            .sidebar:hover {
                scrollbar-color: var(--line) transparent;
            }

            .log-list::-webkit-scrollbar,
            .spectator-list::-webkit-scrollbar,
            .sidebar::-webkit-scrollbar {
                width: 6px;
            }

            .log-list::-webkit-scrollbar-track,
            .spectator-list::-webkit-scrollbar-track,
            .sidebar::-webkit-scrollbar-track {
                background: transparent;
            }

            .log-list::-webkit-scrollbar-thumb,
            .spectator-list::-webkit-scrollbar-thumb,
            .sidebar::-webkit-scrollbar-thumb {
                background: transparent;
                border-radius: 999px;
            }

            .log-list:hover::-webkit-scrollbar-thumb,
            .spectator-list:hover::-webkit-scrollbar-thumb,
            .sidebar:hover::-webkit-scrollbar-thumb {
                background: var(--line);
            }
        }

        .move-item {
            padding: 10px 12px;
            border-radius: 14px;
            background: var(--field);
            border: 1px solid var(--hairline);
        }

        /* Log rows are flat: whitespace does the separating, not boxes. */
        .log-item {
            padding: 2px 0;
        }

        .log-item {
            display: grid;
            gap: 4px;
        }

        /* Human chat: a plain full-width row. */
        .log-item--chat {
            justify-self: stretch;
        }

        /* Indent the message under the name, leaving the badge gutter on the
           left (badge 20px + 8px gap), so a group lines up in one column. */
        .log-item--chat .log-body {
            padding-left: 28px;
        }

        /* Consecutive messages from the same author drop the name header and
           tuck in close, so a run reads as one grouped block. */
        .log-item--grouped {
            margin-top: -6px;
        }

        /* Initial badge tinted by the author's stone colour (spectator = neutral). */
        .log-avatar {
            flex: 0 0 auto;
            box-sizing: border-box;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10.5px;
            font-weight: 700;
            line-height: 1;
            background: var(--muted);
            color: #fff;
            border: 1px solid transparent;
        }

        .log-avatar--black {
            background: #20201e;
            color: #f3efe8;
            /* rim brightens in dark mode so the black badge keeps a silhouette */
            border-color: var(--stone-black-rim);
        }

        .log-avatar--white {
            background: #f7f4ee;
            color: #2f2418;
            border-color: var(--stone-white-rim);
        }

        /* The compose badge is decorative; keep it fainter than the chat badges
           so the input stays the focus. */
        #composeAvatar {
            opacity: 0.35;
        }

        /* Join / leave / reconnect / disconnect: faint left-aligned note line. */
        .log-item--note {
            justify-self: stretch;
            padding: 2px 4px 2px 0;
            color: var(--muted);
        }

        .log-item--note .log-body {
            font-size: 12px;
            line-height: 1.4;
            color: var(--muted);
        }

        .log-item--note .log-body::before {
            content: "·";
            margin-right: 6px;
            opacity: 0.7;
        }

        /* Game end / timeout / draw: a light left line (no card), but the result
           text stays readable so the outcome isn't demoted to a faint note.
           Left padding matches the chat badge edge (12px) so it lines up. */
        .log-item--result {
            justify-self: stretch;
            padding: 3px 6px 3px 0;
        }

        .log-item--result .log-body {
            font-size: 13px;
            font-weight: 400;
            color: var(--text);
        }

        .log-head {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .log-body {
            font-size: 14px;
            line-height: 1.55;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Secondary to the result line it hangs off: no bold, no accent colour
           at rest — a hairline underline carries the affordance. The accent
           only comes up on hover/focus (dark mode's mint accent would otherwise
           outshine the message itself). */
        .log-action-button {
            appearance: none;
            margin-left: 8px;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--muted);
            font: inherit;
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-decoration-color: var(--line);
            text-underline-offset: 3px;
            cursor: pointer;
            transition: color 0.15s ease, text-decoration-color 0.15s ease;
        }

        @media (hover: hover) {
            .log-action-button:hover {
                color: var(--accent);
                text-decoration-color: currentColor;
            }
        }

        .log-action-button:focus-visible,
        .log-action-button:active {
            color: var(--accent);
            text-decoration-color: currentColor;
        }

        @media (hover: hover) {
        .log-action-button:hover {
            color: var(--accent-strong);
        }
        }

        /* Compose sits at the top (messages grow upward), kept understated: a
           soft pill with the user's stone-colour badge, a borderless input and
           a muted send that only lights up on hover. */
        .log-compose {
            margin: 0 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            /* left padding matches the chat item padding (12px) so the compose
               badge and input line up vertically with the chat badges/messages */
            padding: 4px 6px 4px 12px;
            border-radius: 999px;
            background: var(--fill-soft);
            border: 0;
            transition: background 0.18s ease, box-shadow 0.18s ease;
        }

        .log-compose:focus-within {
            background: var(--panel-strong);
            box-shadow: inset 0 0 0 1px var(--focus-ring);
        }

        /* Send only lights up once there is something to send. */
        .log-compose.has-text .log-send {
            color: var(--accent);
        }

        .log-compose input {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 30px;
            padding: 2px;
            border: 0;
            background: transparent;
            color: var(--text);
            font-size: 13px;
        }

        .log-compose input:focus {
            outline: none;
        }

        .log-compose input::placeholder {
            color: var(--muted);
        }

        .log-send {
            flex: 0 0 auto;
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 12.5px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 999px;
            cursor: pointer;
            transition: color 0.15s ease;
        }

        @media (hover: hover) {
        .log-send:hover {
            color: var(--accent);
        }
        }

        .log-author {
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 0.02em;
            color: var(--muted);
        }

        /* Action feedback / errors: same top-centre stack as the presence
           toasts (one place to look), but visually heavier — importance is
           carried by weight, not by position. Hidden state keeps no height so
           the presence pills close ranks around it. */
        .toast {
            max-width: min(420px, calc(100vw - 36px));
            padding: 12px 18px;
            border-radius: 999px;
            background: var(--toast-bg);
            color: #f8f5ef;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            box-shadow: 0 12px 28px rgba(24, 17, 12, 0.26);
            opacity: 0;
            transform: translateY(-6px);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Light, stacked presence toasts (join / leave / disconnect / reconnect),
           kept subtler than the action/error toast that shares this stack. */
        .presence-toasts {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 19;
            pointer-events: none;
        }

        .presence-toast {
            max-width: min(360px, calc(100vw - 32px));
            padding: 5px 12px;
            border-radius: 999px;
            background: var(--panel-strong);
            color: var(--muted);
            border: 1px solid var(--line);
            font-size: 12.5px;
            box-shadow: 0 6px 16px rgba(24, 17, 12, 0.12);
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .presence-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .mono {
            font-family: Consolas, "Courier New", monospace;
            letter-spacing: 0.02em;
        }

        /* PC画面幅 (1081px以上) のレイアウト: スクロールさせず1画面に収める */
        @media (min-width: 1081px) {
            html, body {
                height: 100%;
                overflow: hidden;
            }
            body {
                padding: 4px;
            }
            .app-shell {
                height: 100%;
                display: flex;
                flex-direction: column;
                padding: 8px;
            }
            .game-screen {
                flex: 1;
                min-height: 0;
                display: grid;
                grid-template-rows: minmax(0, 1fr);
            }
            .layout {
                min-height: 0;
                align-items: center;
                gap: 12px;
                height: 100%;
            }
            .panel {
                padding: 12px;
            }
            .layout > .panel:first-child {
                display: flex;
                flex-direction: column;
                min-height: 0;
                height: min(100%, 820px);
                max-height: calc(100vh - 24px);
                justify-content: center;
                gap: 8px;
            }
            .players, .board-controls {
                flex: 0 0 auto;
            }
            .board-container {
                flex: 0 1 auto;
                min-height: 0;
                height: min(calc(100vh - 150px), 680px);
                max-height: 680px;
                aspect-ratio: 1 / 1;
            }
            .sidebar .card h2 {
                display: none !important;
            }
            .sidebar {
                display: flex;
                flex-direction: column;
                min-height: 0;
                max-height: min(calc(100vh - 24px), 760px);
                overflow-y: auto; 
            }
            .sidebar > .sidebar-card {
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            /* Chat grows with its content up to a cap, then scrolls inside —
               on flat paper an empty fixed-height block would read as a hole. */
            .side-chat {
                max-height: 420px;
                flex: 0 1 auto;
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .side-chat .log-list {
                flex: 0 1 auto;
                max-height: none;
                overflow-y: auto;
            }
        }

        /* スマホ・タブレット縦など (1080px以下) */
        @media (min-width: 1081px) and (max-width: 1280px) and (orientation: landscape) {
            .layout > .panel:first-child {
                gap: 6px;
            }
            .players {
                margin-bottom: 4px;
            }
            .board-container {
                height: min(calc(100vh - 108px), 660px);
                max-height: 660px;
            }
        }

        @media (max-width: 1080px) {
            .layout {
                grid-template-columns: 1fr;
                /* Stacked: keep the chat close under the board so it can be
                   glanced at while playing (phone / half-window PC). */
                row-gap: 5px;
            }
            /* Trim only the panel's bottom so the board itself stays put. */
            .game-screen .layout > .panel:first-child {
                padding-bottom: 8px;
            }
            /* Stacked: the sidebar hugs the board's width like the seat and
               control strips do, instead of growing with the window. */
            .sidebar {
                width: min(100%, var(--board-size, 680px));
                margin-left: auto;
                margin-right: auto;
                box-sizing: border-box;
            }
            .sidebar .card h2 {
                display: none !important;
            }
            .board-container {
                aspect-ratio: 1 / 1;
            }
        }

        /* スマホ向けレイアウト */
        @media (min-width: 721px) and (max-width: 1080px) {
            /* Trim the gap above the board (app top → rectangle) to about half;
               only the top side, so left/right/bottom spacing is unchanged. */
            body {
                padding-top: clamp(3px, 0.9vw, 9px);
            }
            .app-shell {
                padding-top: clamp(5px, 1vw, 9px);
            }
            .players,
            .board-controls {
                width: min(100%, var(--board-size, 680px));
                max-width: 680px;
                margin-left: auto;
                margin-right: auto;
            }
            .board-container {
                width: min(100%, 680px);
                max-width: 680px;
                margin: 0 auto;
            }
        }

        @media (min-width: 721px) and (max-width: 1080px) and (orientation: landscape) {
            .players {
                margin-bottom: 4px;
            }
        }

        @media (max-width: 720px) {
            body { padding: 0; }
            .app-shell {
                width: 100%;
                margin: 0 auto;
                padding: 6px;
                border-radius: 0;
            }

            .game-screen .layout > .panel:first-child {
                background: transparent;
                border: none;
                padding: 0;
                border-radius: 0;
                box-shadow: none;
            }

            .panel,
            .card {
                padding: 12px;
                border-radius: 18px;
            }

            .players {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 0;
                margin-bottom: 8px;
            }

            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                grid-template-columns: 1fr;
            }

            .info-topline {
                align-items: stretch;
            }

            .board-wrap {
                border-radius: 18px;
            }

            .player-card {
                min-width: 0;
            }

            .player-name {
                /* constant row core so empty and seated seats share one height
                   (the ready slot no longer props the row up when hidden) */
                line-height: 1.5;
                min-height: 1.5em;
            }

            .player-status {
                padding: 4px 7px;
                font-size: 10px;
            }

            /* Slightly tighter chat rhythm on small screens. */
            .log-list {
                gap: 8px;
            }

            .log-body {
                line-height: 1.5;
            }

            .game-topbar {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .board-controls { padding: 4px 6px; gap: 4px; margin-top: 4px; border-radius: 12px; }
            .menu-icon-btn { width: 42px; height: 46px; }
            .nav-btn { height: 46px; }
            /* When space runs out (<360px), let the rarely-used ±4 buttons
               give way first so the primary ＜/＞ keep the biggest target. */
            .nav-btn.branch { width: 3.2em; min-width: 0; }
            .nav-btn.step { width: 4em; min-width: 3.4em; }
            .nav-btn.reset { width: 3.4em; min-width: 3em; }

            .toast {
                max-width: calc(100vw - 20px);
            }
        }
    </style>
</head>

                                    <span class="control-icon" aria-hidden="true">
                                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5c5.27 0 9.4 4.18 10.58 6.5C21.4 13.82 17.27 18 12 18S2.6 13.82 1.42 11.5C2.6 9.18 6.73 5 12 5m0-2C5.73 3 1 8.5 1 11.5S5.73 20 12 20s11-5.5 11-8.5S18.27 3 12 3m0 4.5A4.5 4.5 0 1 0 16.5 12 4.5 4.5 0 0 0 12 7.5m0 2A2.5 2.5 0 1 1 9.5 12 2.5 2.5 0 0 1 12 9.5"/></svg>
                                    </span>
                                </button>
                                <div id="viewMenu" class="control-menu-popup" hidden>
                                    <button id="langBtn" class="control-menu-item language-menu-item" type="button">
                                        <span class="control-menu-label">言語</span>
                                        <span class="control-menu-value">
                                            <svg class="language-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">

        // The stone sound used to prefer a WebAudio buffer and fall back to this
        // pool, which made it the only sound whose behaviour varied per play —
        // and on iOS WebAudio obeys the ring/silent switch while HTMLAudio does
        // not, so the stone alone went silent. Uniform beats low-latency here;
        // the sources are short WAVs so the element path starts fast enough.
        const STONE_SOUND_SRC = './mp3/play1.wav';
        const NOTIFICATION_SOUND_SRC = './mp3/notify.wav';
        const SOUND_POOL_SIZE = 4;
        const SOUND_POOL_MAX = 8;
        const LAST_MOVE_HIGHLIGHT_MS = 2000;
        // The ring holds for the first half and fades over the second, so it
        // draws the eye once when the stone lands and then leaves quietly.
        // Opacity-only fades are motion-safe, so no reduced-motion gate.
        const LAST_MOVE_RING_FADE_MS = 1000;
        const stoneSoundPool = { src: STONE_SOUND_SRC, elements: [] };
        const notificationSoundPool = { src: NOTIFICATION_SOUND_SRC, elements: [] };
        let lastReportedSec = null;

        function createAudioElement(src) {
            const sound = new Audio(src);
            sound.preload = 'auto';
            return sound;
        }

        function initSoundPool(pool) {
            if (pool.elements.length || !window.Audio) return;
            pool.elements = Array.from({ length: SOUND_POOL_SIZE }, () => createAudioElement(pool.src));
        }

        function playPooledSound(pool) {
            initSoundPool(pool);
            let sound = pool.elements.find((item) => item.paused || item.ended);
            if (!sound && pool.elements.length < SOUND_POOL_MAX) {
                sound = createAudioElement(pool.src);
                pool.elements.push(sound);
            }
            if (!sound) return;
            try {
                sound.currentTime = 0;
            } catch (error) {
                // iOS may reject currentTime before metadata is available; play from the start anyway.
            }
            sound.play().catch(() => {});
        }

        function primeAudioFromUserGesture() {
            if (!soundEnabled) return;
            [stoneSoundPool, notificationSoundPool].forEach((pool) => {
                initSoundPool(pool);
                pool.elements.forEach((sound) => {
                    // load() aborts an element mid-play, so only prime ones that
                    // have fetched nothing yet — re-priming would clip playback.
                    if (sound.readyState !== 0) return;
                    try { sound.load(); } catch (error) {}
                });
            });
        }

        ['pointerdown', 'click', 'keydown', 'touchend'].forEach((eventName) => {
            document.body.addEventListener(eventName, primeAudioFromUserGesture, { capture: true, passive: true });
        });

        function playStoneSound() {
            if (!soundEnabled) return;
            playPooledSound(stoneSoundPool);

        function i18n(key, arg) {
            const resolved = ERROR_KEY_ALIASES[key] || key;
            const lang = translations[currentLanguage] || translations['ja'];
            const val = lang[resolved] || translations['ja'][resolved] || resolved;
            if (typeof val === 'function') return val(arg);
            return val;
        }

            return Object.prototype.hasOwnProperty.call(arguments, 1) ? { key, arg } : { key };

            if (spec && typeof spec === 'object' && spec.key) {
                return i18n(spec.key, spec.arg);
            }
            return String(fallback || spec || '');
        }

        function setScreen(name) {
            // Only refit the board when actually entering the game screen.
            // Refitting on every render made the board jump a size whenever a
            // panel's height changed (comment / seat / time). Window resize and
            // coord-toggle call resizeBoard() directly.
            const wasGame = !elements.gameScreen.hidden;
            elements.lobbyScreen.hidden = name !== 'lobby';
            elements.gameScreen.hidden = name !== 'game';
            if (name === 'game' && !wasGame) {
                requestAnimationFrame(() => resizeBoard());
            }
        }

        function sanitizeName(value) {
            const fallback = 'Player';
            const trimmed = String(value || '').trim().replace(/\s+/g, ' ');
            return trimmed || fallback;
        }

        function splitGraphemes(value) {
            const text = String(value || '');
            if (typeof Intl?.Segmenter === 'function') {
                const segmenter = new Intl.Segmenter(undefined, { granularity: 'grapheme' });
                return Array.from(segmenter.segment(text), ({ segment }) => segment);
            }
            return Array.from(text);
        }

        function isHalfWidthGrapheme(grapheme) {
            let hasBaseCharacter = false;
            for (const character of Array.from(grapheme)) {
                if (/\p{Mark}/u.test(character) || character === '\u200d' || character === '\ufe0f') continue;
                hasBaseCharacter = true;
                const codePoint = character.codePointAt(0);
                const isHalfWidth = codePoint <= 0x7f
                    || (codePoint >= 0xff61 && codePoint <= 0xff9f)
                    || (codePoint >= 0xffa0 && codePoint <= 0xffdc);
                if (!isHalfWidth) return false;
            }
            return hasBaseCharacter;
        }

        function getTextWidthUnits(value) {
            return splitGraphemes(value).reduce(
                (total, grapheme) => total + (isHalfWidthGrapheme(grapheme) ? 1 : 2),
                0
            );
        }

        function createToken() {
            if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                return window.crypto.randomUUID();
            }
            return `${Date.now()}-${Math.random().toString(36).slice(2, 12)}`;
        }

        function getLocalPlayerToken(roomCode) {
            const storageKey = `${PLAYER_TOKEN_PREFIX}${roomCode}`;
            try {
                const existing = window.localStorage.getItem(storageKey);
                if (existing) return existing;
                const nextToken = createToken();
                window.localStorage.setItem(storageKey, nextToken);
                return nextToken;
            } catch (error) {
                return createToken();
            }
        }

        function clearRoomStateSnapshot(nextRoomId) {
            if (!nextRoomId) return;
            try {
                window.localStorage.removeItem(`${ROOM_STATE_PREFIX}${nextRoomId}`);
            } catch (error) {
                // Best-effort cleanup of any legacy local cache.
            }
        }

        function clamp(value, min, max) {
            return Math.min(max, Math.max(min, value));
        }

        function getDefaultUserSettings() {
            return {
                displayName: '',
                roomCode: '',
                baseMinutes: DEFAULT_BASE_MINUTES,
                incrementSeconds: DEFAULT_INCREMENT_SECONDS,
                soundEnabled: true,
                showCoords: true,
                showMoveNumbers: true,
                moveConfirmEnabled: false,
                stoneShading: false,
                boardThemeIndex: 0,
                colorScheme: 'light',
                language: 'ja',
                readyHintSeen: false,
            };
        }

        function normalizeUserSettings(settings) {
            const defaults = getDefaultUserSettings();
            const next = { ...defaults, ...(settings || {}) };
            next.displayName = String(next.displayName || '').slice(0, 24);
            next.roomCode = String(next.roomCode || '').slice(0, 24);
            const baseMinutes = Number(next.baseMinutes);
            const incrementSeconds = Number(next.incrementSeconds);
            next.baseMinutes = clamp(Number.isFinite(baseMinutes) && baseMinutes > 0 ? baseMinutes : defaults.baseMinutes, 1, 180);
            next.incrementSeconds = clamp(Number.isFinite(incrementSeconds) ? incrementSeconds : defaults.incrementSeconds, 0, 60);
            next.soundEnabled = next.soundEnabled !== false;
            next.showCoords = next.showCoords !== false;
            next.showMoveNumbers = next.showMoveNumbers !== false;
            next.moveConfirmEnabled = next.moveConfirmEnabled === true;
            next.stoneShading = next.stoneShading === true;
            next.boardThemeIndex = clamp(Number(next.boardThemeIndex) || 0, 0, boardThemes.length - 1);
            next.colorScheme = ['light', 'gray', 'dark'].includes(next.colorScheme) ? next.colorScheme : 'light';
            next.language = ['ja', 'zh', 'en'].includes(next.language) ? next.language : 'ja';
            next.readyHintSeen = next.readyHintSeen === true;
            return next;
        }

        function loadUserSettings() {
            try {
                return normalizeUserSettings(JSON.parse(window.localStorage.getItem(USER_SETTINGS_STORAGE_KEY) || 'null'));
            } catch (error) {
                return getDefaultUserSettings();
            }
        }

        function persistUserSettings(overrides = {}) {
            const current = loadUserSettings();
            const next = normalizeUserSettings({ ...current, ...overrides });
            try {
                window.localStorage.setItem(USER_SETTINGS_STORAGE_KEY, JSON.stringify(next));
            } catch (error) {
                // Best-effort user preference cache.
            }
            return next;
        }

        function readTimeSettingsFromInputs() {
            const settings = loadUserSettings();
            const rawBaseMinutes = Number(settings.baseMinutes);
            const rawIncrementSeconds = Number(settings.incrementSeconds);
            const baseMinutes = clamp(Number.isFinite(rawBaseMinutes) && rawBaseMinutes > 0 ? rawBaseMinutes : DEFAULT_BASE_MINUTES, 1, 180);
            const incrementSeconds = clamp(Number.isFinite(rawIncrementSeconds) ? rawIncrementSeconds : DEFAULT_INCREMENT_SECONDS, 0, 60);
            return { baseMinutes, incrementSeconds };
        }

        function persistLobbySettings() {
            persistUserSettings({
                displayName: elements.nameInput.value,
                roomCode: elements.roomCodeInput.value,
            });

        const COLOR_SCHEME_ORDER = ['light', 'gray', 'dark'];

        function applyColorScheme() {

                ? 'colorSchemeGray'
                : (colorSchemePreference === 'dark' ? 'colorSchemeDark' : 'colorSchemeLight');

        function cycleColorScheme() {
            const index = COLOR_SCHEME_ORDER.indexOf(colorSchemePreference);
            colorSchemePreference = COLOR_SCHEME_ORDER[(index + 1) % COLOR_SCHEME_ORDER.length];
            applyColorScheme();

        function syncViewSettingsControls() {
            const languageCode = currentLanguage.toUpperCase();
            document.querySelectorAll('.language-code').forEach((item) => {
