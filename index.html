        async function copyTextToClipboard(text) {
            if (navigator.clipboard?.writeText) {
                try {
                    await navigator.clipboard.writeText(text);
                    return;
                } catch (_error) {
                    // Some mobile browsers expose Clipboard API but reject it.
                    // Fall through to the selection-based copy path.
                }
            }

            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.setAttribute('readonly', 'readonly');
            textarea.style.position = 'fixed';
            textarea.style.top = '0';
            textarea.style.left = '0';
            textarea.style.width = '1px';
            textarea.style.height = '1px';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            textarea.setSelectionRange(0, textarea.value.length);

            try {
                const copied = document.execCommand('copy');
                if (!copied) throw new Error('copy failed');
            } finally {
                document.body.removeChild(textarea);
            }
        }

        function scheduleReconnect(delayMs = 800) {
            if (sessionTerminated) return;

        // Single entry point for joining/reconnecting. The server (Durable
        // Object) owns the game and reports presence; this client just adopts
        // the broadcast state and relayed messages.
        function connectToRoom() {
            if (!roomId || !localPlayerToken) return;
            clearReconnectTimer();
            sessionTerminated = false;

            if (peer) {
                try { peer.destroy(); } catch (error) { }
                peer = null;
            }

            const name = sanitizeName(elements.nameInput.value || 'Player');
            const thisPeer = new Peer(roomId, { token: localPlayerToken, name, settings: buildSettings() });
            peer = thisPeer;

            thisPeer.on('open', (id) => {
                if (peer !== thisPeer) return;
                localPeerId = id;
                elements.leaveRoomBtn.disabled = false;
            });

            // The Durable Object owns the game. We only adopt the authoritative
            // state it broadcasts. Every participant is equal (no host).
            thisPeer.on('game-state', ({ state: nextState, serverNow, lastAction, presence }) => {
                if (peer !== thisPeer) return;
                handleGameState(nextState, serverNow, lastAction);
                if (Array.isArray(presence)) {
                    presence.forEach((p) => {
                        if (!p || !p.messageKey) return;
                        // A setting-change toast carries `by` (actor token); skip
                        // showing it to the person who made the change.
                        if (p.by && p.by === localPeerId) return;
                        showPresenceToast(i18n(p.messageKey, p.messageArg));
                    });
                }
            });

            thisPeer.on('roster', () => {
                if (peer !== thisPeer) return;
                applyRole();
            });

            // A rejected intent: undo any optimistic UI and surface the reason.
            // The server sends an i18n CODE; localize it here.
            thisPeer.on('notice', ({ message }) => {
                if (peer !== thisPeer) return;
                clearPendingMove();
                clearLocalOptimisticRequests();
                render();
                if (message) showToast(i18n(message));
            });

            thisPeer.on('close', () => {
                if (peer !== thisPeer) return;
                if (sessionTerminated) return;
                setConnectionLabel(i18n('msgRoomSyncing'));
                scheduleReconnect(800);
                render();
            });

            thisPeer.on('error', (error) => {
                if (peer !== thisPeer) return;
                if (error && error.type === 'network') {
                    setConnectionLabel(i18n('msgRoomSyncing'));
                    return; // the 'close' event will drive the reconnect.
                }
                showToast(`Error: ${(error && (error.type || error.message)) || 'unknown'}`);
            });

            thisPeer.on('displaced', () => {
                if (peer !== thisPeer) return;
                sessionTerminated = true;
                clearReconnectTimer();
                showToast(i18n('msgSessionReplaced'));
                closeLocalSessionWithoutSnapshot();
            });

            thisPeer.on('protocol-mismatch', () => {
                if (peer !== thisPeer) return;
                sessionTerminated = true;
                clearReconnectTimer();
                window.location.reload();
            });
        }

        // No host/admin role: every participant is equal. localMode only tracks
        // idle (lobby) vs in-room. All authority is in the Durable Object.
        function applyRole() {
            if (!peer) return;
            localMode = 'guest';
            elements.leaveRoomBtn.disabled = false;
            render();
        }

        // Adopt the authoritative state the Durable Object broadcasts on every
        // change. This replaces the old host-broadcast / guest-receive split:
        // everyone (including the admin) just renders what the server sends.
        function handleGameState(nextState, serverNow, lastAction) {
            if (!nextState || typeof nextState !== 'object') return;
            const incomingVersion = nextState.version || 0;
            const currentVersion = state?.version || 0;
            const currentMoveCount = state?.moves?.length || 0;
            const incomingMoves = Array.isArray(nextState.moves) ? nextState.moves : [];
            const newestIncomingMove = incomingMoves[incomingMoves.length - 1];
            // Ring only for moves placed by someone else — the person who just
            // played knows where their own stone is (spectators see all rings).
            const shouldHighlightIncomingMove = Boolean(
                state &&
                incomingVersion &&
                incomingVersion > currentVersion &&
                incomingMoves.length > currentMoveCount &&
                newestIncomingMove &&
                newestIncomingMove.peerId !== localPeerId
            );
            // Ignore a stale/out-of-order broadcast (shouldn't happen over one
            // ordered socket, but cheap to guard).
            if (incomingVersion && currentVersion && incomingVersion < currentVersion) {
                return;
            }
            // Align our wall clock to the server's so clock interpolation in
            // getDisplayRemainingMs uses authoritative (DO) time. serverNow is
            // stamped at send and we read Date.now() at processing, so every
            // sample understates the true offset by its delivery delay — and a
            // backgrounded iPhone can hold a message for seconds. Keep the max:
            // the best-delivered sample wins, and the display can only err on
            // the pessimistic side (never shows more time than the DO has).
            if (typeof serverNow === 'number' && serverNow > 0) {
                const sample = serverNow - Date.now();
                clockOffsetMs = clockOffsetMs === null ? sample : Math.max(clockOffsetMs, sample);
            }
            if (peer) localMode = 'guest';
            const previousState = state;
            state = nextState;
            ensurePairRenjuState();
            refreshLocalizedResultText();
            clearPendingMove();
            clearConfirmMovePoint();
            if (shouldHighlightIncomingMove) {
                startLastMoveHighlight(incomingMoves[incomingMoves.length - 1]);
            }
            reactToStateChange(previousState, state, lastAction);
            elements.leaveRoomBtn.disabled = false;
            roomId = state.roomId || roomId;
            setConnectionLabel(i18n('msgRoomConnected'));
            if (displayMoveCount !== -1) {
                const currentMax = getRenderedMoves().length;
                if (displayMoveCount > currentMax) displayMoveCount = -1;
            }
            render();
            // 検討モードで ⟳ を押した直後の状態更新なら、移動先（終局図）の
            // 最終手をハイライトする（予約は 1.5 秒で失効）。
            if (reviewResetHighlightUntil) {
                if (Date.now() <= reviewResetHighlightUntil) highlightNewestVisibleMove();
                reviewResetHighlightUntil = 0;
            }
        }

        // Client-side feedback the Durable Object can't produce: stone sound for
        // an opponent's placement, swap/draw/takeback notification sounds, and an
        // orange highlight on the (re)played stone. Driven by the state diff plus
        // the lastAction hint (kind + actor) the server attaches to broadcasts.
        function reactToStateChange(prev, next, lastAction) {
            if (!prev || !next) return; // first state load: no reactions
            const prevMoves = prev.moves?.length || 0;
            const nextMoves = next.moves?.length || 0;
            const lastMove = next.moves?.[nextMoves - 1];

            if (nextMoves > prevMoves && lastMove && lastMove.peerId !== localPeerId) {
                playStoneSound();
            }

            // 終局図は必ず見せる。手を戻して眺めている最中に終局しても、
            // ローカルの表示位置を捨てて最新（＝終局図）へ戻す。状態側は
            // finishGame が reviewMoves を終局図で作り直しているので、
            // displayMoveCount を外すだけで終局図が出る。
            if (prev.status === 'playing' && next.status === 'finished') {
                displayMoveCount = -1;
            }

            // 自分の手番になった瞬間も最新図へ戻す。古い局面を表示したまま
            // 着手や Swap を選ばせないため、着手に限らず手番の主体が自分へ
            // 移った時点で引き戻す。手番の変わり目だけを見るので、手番中に
            // 自分で巻き戻したものは以降の状態更新では奪わない。
            const prevActorPeerId = GameCore.phaseDescriptor({ ...gameCoreCtx(), state: prev }).actorPeerId;
            const nextActorPeerId = phaseDescriptor().actorPeerId;
            if (nextActorPeerId && nextActorPeerId === localPeerId && prevActorPeerId !== localPeerId) {
                displayMoveCount = -1;
            }

            // swap / draw / takeback notifications fire on the seated opponent:
            // swap also flashes a whole-board orange alert (mirrors v1).
            const kind = lastAction && lastAction.kind;
            if (kind && isActiveActionNotification(kind)
                && shouldNotifyRemoteAction(lastAction.actorPeerId, kind)) {
                // render() は reactToStateChange の後に走るので、.active が
                // 交換後の手番を指してからパルスを打つ。
                if (kind === 'swap') window.setTimeout(pulseSeatSwap, 0);
                playActionNotificationSound();
            }

            // 開局の色交換チップは actor 本人以外の全員（観戦者含む）に出す。
            // state は採用済みなので getTeamForPeer は交換後の色を返す。
            if (kind === 'swap' && lastAction.actorPeerId && lastAction.actorPeerId !== localPeerId) {
                showSwapNotice();
            }
        }

        function handleVisibleResync() {
            if (!roomId) return;
            if (!peer || peer.disconnected || peer.destroyed) {
                connectToRoom();
                return;
            }
            // The Durable Object is the authority and re-sends state on any
            // change; a live socket needs no pull. Just redraw with what we have.
            render();
        }

        function scheduleVisibleResyncChecks() {
            handleVisibleResync();

            window.setTimeout(() => {
                if (document.visibilityState === 'visible') handleVisibleResync();
            }, 1000);

            window.setTimeout(() => {
                if (document.visibilityState === 'visible') handleVisibleResync();
            }, 3000);
        }

        function formatTime(ms) {
            const safe = Math.max(0, ms);
            const minutes = Math.floor(safe / 60000);
            const seconds = Math.floor((safe % 60000) / 1000);
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        const TIME_LOW_MS = 10000;
        const TIME_CRITICAL_MS = 5000;

        // Colour the clock as it runs down (amber → red).
        function updateTimerUrgency(element, peerId) {
            const playing = Boolean(state && state.status === 'playing' && peerId);
            const remaining = playing ? getDisplayRemainingMs(peerId) : Infinity;
            element.classList.toggle('time-low', playing && remaining <= TIME_LOW_MS && remaining > TIME_CRITICAL_MS);
            element.classList.toggle('time-critical', playing && remaining <= TIME_CRITICAL_MS);
        }

        function getDisplayRemainingMs(peerId) {
            if (!state || !peerId) return 0;
            const clockKey = getClockKeyForPeer(peerId);
            const base = state.clocks.remainingMsByPeerId[clockKey] ?? state.config.baseSeconds * 1000;
            const sameActiveClock = getClockKeyForPeer(state.clocks.activePeerId) === clockKey;
            if (state.status !== 'playing' || !sameActiveClock || !state.clocks.activeStartedAt) {
                return base;
            }
            // activeStartedAt is in DO time; align our clock to it. In local
            // mode there is no server, so the offset stays null (= 0 here).
            return Math.max(0, base - ((Date.now() + (clockOffsetMs || 0)) - state.clocks.activeStartedAt));
        }

        function applyElapsedTime(timestamp = Date.now()) {
            return GameCore.applyElapsedTime(gameCoreCtx(), timestamp);
        }

        // The Durable Object now owns the clock (it runs the deadline alarm and
        // drives pause/resume from the engine's clock effects). These remain as
        // injected ctx hooks for the shared game-core, but the client no longer
        // mutates the clock authoritatively — it only displays state.clocks.
        function startClockFor(peerId, timestamp = Date.now()) {
            if (!state || !peerId) {
                stopClock();
                return;
            }
            GameCore.setActiveClock(gameCoreCtx(), peerId, timestamp);
        }

        function stopClock() {
            if (!state) return;
            GameCore.clearActiveClock(gameCoreCtx());
        }

        function grantIncrement(peerId) {
            return GameCore.grantIncrement(gameCoreCtx(), peerId);
        }

        function grantIncrementIfTurnPasses(actorPeerId, previousActorPeerId) {
            return GameCore.grantIncrementIfTurnPasses(gameCoreCtx(), actorPeerId, previousActorPeerId);
        }

        function swapColors() {
            return GameCore.swapColors(gameCoreCtx());

        // Bundle of board/seat helpers game-core needs, so the rule logic can
        // live in the shared (UI-free) module while still reading live state.
        // Only the environment-specific dependencies remain injected now that
        // the pure state/seat/color/turn helpers live in game-core. These are
        // what the worker will swap for its own implementations (DO clock,
        // structured logs, identity i18n) in Step 2.
        function gameCoreCtx() {
            return {
                state,
                center: CENTER,
                // start/stop carry the environment-specific timer side effect
                // (browser arms the DO; worker derives timeout). The pure clock
                // arithmetic now lives in game-core.
                startClockFor,
                stopClock,
                // naming
                getPeerName,
                resetDisplayMoveCount: () => { displayMoveCount = -1; },
                // ui / i18n (worker will swap these for codes / event collectors)
                i18n,
                messageSpec,
                renderMessageSpec,
                addLog,
            };
        }

        function isRemoteActionNotificationKind(kind) {
            return kind === 'swap' || kind === 'draw' || kind === 'takeback';
        }

        function isActiveActionNotification(kind) {
            if (kind === 'swap') return true;
            if (kind === 'draw') return Boolean(state?.drawOfferByPeerId);
            if (kind === 'takeback') return Boolean(state?.takebackOfferByPeerId);
            return false;
        }

        function shouldNotifyRemoteAction(actorPeerId, kind) {
            if (state?.pairRenjuEnabled && kind === 'draw') {
                return localPeerId === state.drawResponderPeerId && actorPeerId !== localPeerId;
            }
            if (state?.pairRenjuEnabled && kind === 'takeback') {
                return localPeerId === state.takebackResponderPeerId && actorPeerId !== localPeerId;
            }
            return Boolean(
                isRemoteActionNotificationKind(kind) &&
                actorPeerId &&
                actorPeerId !== localPeerId &&
                isSeatedPlayerId(actorPeerId) &&
                isSeatedPlayerId(localPeerId)
            );
        }

        // Send a player intent to the authoritative Durable Object. Our own move
        // / draw / takeback get optimistic UI; the server's game-state broadcast
        // confirms, or a 'notice' rolls the optimism back.
        function sendAction(action) {
            if (!state) return;
            if (!peer || !localPeerId) {
                showToast(i18n('errUnconnected'));
                return;
            }
            if (action.kind === 'move') {
                action = { ...action, requestId: createRequestId() };
                setPendingMove(action);
            }
            if ((action.kind === 'draw' || action.kind === 'takeback') && !applyOptimisticRequest(action.kind)) {
                return;
            }
            peer.sendIntent(action);
        }

        function updateTimeSeatDividerPosition() {
            if (elements.timeSettingsDialog.hidden || !elements.timeHandicapInput.checked) return;

            const rightMinusButton = document.querySelector(
                '.time-right-control.time-base-control .time-step-button[data-step="-1"]'

        function syncTimeSettingsDialogMode() {
            const hasHandicap = elements.timeHandicapInput.checked;
            elements.timeRightBaseInput.disabled = !hasHandicap;
            elements.timeRightIncrementInput.disabled = !hasHandicap;
            document.querySelectorAll('[data-step-target="timeRightBaseInput"], [data-step-target="timeRightIncrementInput"]')
                .forEach((button) => {
                    button.disabled = !hasHandicap;
                });
            document.querySelectorAll('.time-right-control').forEach((control) => {
                control.hidden = !hasHandicap;
            });
            elements.uiTimeLeftLabel.hidden = !hasHandicap;
            elements.uiTimeRightLabel.hidden = !hasHandicap;
            elements.timeSeatGrid.classList.toggle('single', !hasHandicap);

                elements.timeRightBaseInput.value = elements.timeLeftBaseInput.value;
                elements.timeRightIncrementInput.value = elements.timeLeftIncrementInput.value;

        function stepTimeInput(button) {
            const input = document.getElementById(button.dataset.stepTarget);
            if (!input || input.disabled) return;
            const candidates = input.id.includes('Increment')
                ? INCREMENT_SECOND_STEPS
                : BASE_MINUTE_STEPS;
            const currentValue = Number(input.value);
            const isDecrease = Number(button.dataset.step) < 0;
            const nextValue = isDecrease
                ? [...candidates].reverse().find((value) => value < currentValue)
                : candidates.find((value) => value > currentValue);
            if (nextValue == null) return;
            input.value = String(nextValue);
            input.dispatchEvent(new Event('input', { bubbles: true }));
        }

        function clampTimeInput(input) {
            const min = Number(input.min);
            const max = Number(input.max);
            const fallback = Number.isFinite(min) ? min : 0;
            const rawValue = Number(input.value);
            const nextValue = clamp(
                Number.isFinite(rawValue) ? Math.round(rawValue) : fallback,
                Number.isFinite(min) ? min : rawValue,
                Number.isFinite(max) ? max : rawValue
            );
            input.value = String(nextValue);
            input.dispatchEvent(new Event('input', { bubbles: true }));
        }

        function readClockSettingInputs(baseInput, incrementInput) {
            const rawBaseMinutes = Number(baseInput.value);
            const rawIncrementSeconds = Number(incrementInput.value);
            const baseMinutes = clamp(Number.isFinite(rawBaseMinutes) && rawBaseMinutes > 0 ? rawBaseMinutes : DEFAULT_BASE_MINUTES, 1, 180);
            const incrementSeconds = clamp(Number.isFinite(rawIncrementSeconds) ? rawIncrementSeconds : DEFAULT_INCREMENT_SECONDS, 0, 60);
            baseInput.value = String(baseMinutes);
            incrementInput.value = String(incrementSeconds);
            return { baseSeconds: baseMinutes * 60, incrementSeconds };
        }

        function applyTimeSettingsDialog() {
            if (!state) return;
            if (state.status === 'playing') {
                closeTimeSettingsDialog();
                showToast(i18n('errChangeTimePlaying'));
                return;

            const hasHandicap = elements.timeHandicapInput.checked;
            const left = readClockSettingInputs(elements.timeLeftBaseInput, elements.timeLeftIncrementInput);
            const right = hasHandicap
                ? readClockSettingInputs(elements.timeRightBaseInput, elements.timeRightIncrementInput)
                : { ...left };
            persistUserSettings({
                baseMinutes: Math.round(left.baseSeconds / 60),
                incrementSeconds: left.incrementSeconds,
            });
            closeTimeSettingsDialog();
            sendAction({ kind: 'time-settings', timeHandicapEnabled: hasHandicap, black: left, white: right });
        }

        function destroyNetworkState() {

        function joinRoom() {
            const roomCode = elements.roomCodeInput.value.trim();

            if (getTextWidthUnits(hostName) > 12) {
                showToast(i18n('errDisplayNameTooLong'));

            if (!roomCode) {

        function resizeBoard() {
            const container = document.getElementById('boardContainer');
            const wrap = document.getElementById('boardWrap');
            
            if (!container || !wrap) return;

            container.style.height = '';
            const containerRect = container.getBoundingClientRect();
            const shouldFitPrimaryControls = window.innerWidth >= 721 && window.innerWidth <= 1080;
            let sizeLimit = Math.min(containerRect.width, containerRect.height || containerRect.width);

            if (shouldFitPrimaryControls && elements.boardControls) {
                const controlsRect = elements.boardControls.getBoundingClientRect();
                const controlsStyle = getComputedStyle(elements.boardControls);
                const controlsMargins = parseFloat(controlsStyle.marginTop || '0')
                    + parseFloat(controlsStyle.marginBottom || '0');
                const availableHeight = window.innerHeight
                    - containerRect.top
                    - controlsRect.height
                    - controlsMargins
                    - 12;
                sizeLimit = Math.min(containerRect.width, availableHeight);
                container.style.height = `${Math.max(0, Math.floor(sizeLimit))}px`;
            }

            const size = shouldFitPrimaryControls
                ? Math.max(1, Math.floor(sizeLimit))
                : Math.max(260, Math.floor(sizeLimit));

            wrap.style.width = size + 'px';
            wrap.style.height = size + 'px';
            // Publish the board's edge so the flat seat/control strips can
            // align themselves to it (they have no panel to contain them).
            document.documentElement.style.setProperty('--board-size', size + 'px');

            const dpr = window.devicePixelRatio || 1;
            elements.boardCanvas.width = Math.floor(size * dpr);
            elements.boardCanvas.height = Math.floor(size * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            
            const smallScreenTopOffset = window.innerWidth <= 599 ? 5 / 620 : 0;
            let baseMargin, horizontalMargin, bottomMargin, topMargin, rightMargin;
            
            if (showCoords) {
                baseMargin = Math.max(24, Math.round(size * (35 / 620)));
                horizontalMargin = Math.max(30, Math.round(size * (43 / 620)));
                bottomMargin = Math.max(30, Math.round(size * (43 / 620)));
                topMargin = Math.max(18, Math.round(size * ((25 / 620) + smallScreenTopOffset)));
                rightMargin = Math.max(18, Math.round(size * (25 / 620)));
            } else {
                // No coordinates: uniform margins on all four sides so the grid
                // is centred (symmetric L/R and T/B) and fills the square — the
                // smaller margin wins and the cell grows to take up the slack.
                horizontalMargin = Math.max(15, Math.round(size * (20 / 620)));
                bottomMargin = horizontalMargin;
                topMargin = horizontalMargin;
                rightMargin = horizontalMargin;
                baseMargin = horizontalMargin;
            }

            const playableWidth = Math.max(1, size - horizontalMargin - rightMargin);
            const playableHeight = Math.max(1, size - topMargin - bottomMargin);
            const cell = Math.max(1, Math.min(playableWidth, playableHeight) / (BOARD_SIZE - 1));
            const coordinateGap = Math.max(18, Math.round(baseMargin * 0.82));
            
            boardGeometry = {
                size,
                padding: horizontalMargin,
                topPadding: topMargin,
                rightPadding: rightMargin,
                bottomPadding: bottomMargin,
                coordinateGap,
                cell,
            };
            renderBoard();
            updateConfirmDialogPosition();
        }

        // Breathing room between the lowest legal point and the dialog above it.
        const CONFIRM_DIALOG_GAP = 10;

        // Screen y of the bottom edge of the lowest legal point, or null when the
        // phase puts no square constraint on the board.
        function constraintBottomY() {
            if (!boardGeometry || !state) return null;
            const constraint = phaseDescriptor().constraint;
            if (!constraint) return null;
            const radius = constraint.kind === 'square' ? constraint.radius
                : constraint.kind === 'center' ? 0
                : null;
            if (radius === null) return null;
            const rect = elements.boardCanvas.getBoundingClientRect();
            const { topPadding, cell } = boardGeometry;
            return rect.top + topPadding + (CENTER + radius) * cell + cell * 0.5;
        }

        function updateConfirmDialogPosition() {
            if (!elements.boardCanvas) return;
            const rect = elements.boardCanvas.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            // Pin to the board's bottom-center, but clamp into the viewport so a
            // board taller than the screen (e.g. landscape phones) can't push the
            // dialog below the fold where it would be invisible.
            let y = Math.min(rect.bottom, window.innerHeight - 16);

            // During swap / choice, "keep" is not a button — it is a move on the
            // board, so the card must never sit on a legal point. The card grows
            // upward from y, so push y down until its top clears the constraint
            // region. Only ever downward: the resting place stays the board's
            // bottom edge. The viewport clamp still has the last word, so a screen
            // too short to fit both simply keeps the old behaviour.
            if (!elements.actionConfirm.hidden) {
                const card = elements.actionConfirm.querySelector('.confirm-card');
                const limit = constraintBottomY();
                if (card && limit !== null) {
                    const needed = limit + CONFIRM_DIALOG_GAP + card.offsetHeight;
                    y = Math.min(Math.max(y, needed), window.innerHeight - 16);
                }
            }

            document.documentElement.style.setProperty('--confirm-dialog-x', `${rect.left + rect.width / 2}px`);
            document.documentElement.style.setProperty('--confirm-dialog-y', `${y}px`);
        }

        function drawConstraintHighlight(descriptor) {
            if (!boardGeometry || !descriptor?.constraint) return;
            const { padding, topPadding, cell } = boardGeometry;
            ctx.save();
            ctx.strokeStyle = 'rgba(22, 70, 59, 0.48)';
            ctx.fillStyle = 'rgba(22, 70, 59, 0.08)';
            ctx.lineWidth = 2;
            ctx.setLineDash([10, 8]);

            if (descriptor.constraint.kind === 'center') {
                const x = padding + CENTER * cell;
                const y = topPadding + CENTER * cell;
                ctx.beginPath();
                ctx.arc(x, y, cell * 0.52, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            if (descriptor.constraint.kind === 'square') {
                const radius = descriptor.constraint.radius;
                const left = padding + (CENTER - radius) * cell - cell * 0.5;
                const top = topPadding + (CENTER - radius) * cell - cell * 0.5;
                const side = (radius * 2 + 1) * cell;
                ctx.beginPath();
                ctx.roundRect(left, top, side, side, 18);
                ctx.fill();
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawOfferedMoves() {
            if (!state || !boardGeometry || !state.opening.offeredMoves.length) return;
            const descriptor = phaseDescriptor();
            const { padding, topPadding, cell } = boardGeometry;
            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = `${Math.floor(cell * 0.42)}px Segoe UI`;
            
            const isSelectPhase = descriptor.boardActionKind === 'select-offer';

            state.opening.offeredMoves.forEach((move, index) => {
                const x = padding + move.x * cell;
                const y = topPadding + move.y * cell;
                ctx.beginPath();
                
                if (isSelectPhase) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
                    ctx.arc(x, y, cell * 0.22, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = 'rgba(28, 26, 24, 0.18)';
                    ctx.strokeStyle = 'rgba(38, 33, 30, 0.45)';
                    ctx.lineWidth = 2;
                    ctx.arc(x, y, cell * 0.34, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.fillText(String(index + 1), x, y + 1);
                }
            });
            ctx.restore();
        }

        // Subtle stone gradient: a soft top-left highlight rolling off into a
        // darker rim. The gradient runs slightly past the stone edge (r * 1.04)
        // so the contour dissolves instead of ending on a hard band.
        function createStoneFill(x, y, r, isBlack) {
            if (!stoneShadingEnabled) return isBlack ? '#20201e' : '#f7f4ee';
            const g = ctx.createRadialGradient(x - r * 0.36, y - r * 0.42, r * 0.06, x, y, r * 1.04);
            if (isBlack) {
                g.addColorStop(0, '#4e4941');
                g.addColorStop(0.35, '#312e29');
                g.addColorStop(0.75, '#201d19');
                g.addColorStop(1, '#14110d');
            } else {
                g.addColorStop(0, '#ffffff');
                g.addColorStop(0.45, '#faf6ec');
                g.addColorStop(0.85, '#eee4d0');
                g.addColorStop(1, '#dccfb6');
            }
            return g;
        }

        // Stone body. Shading ON: a warm drop shadow and no hard outline, so
        // the stone reads as sitting on the board rather than drawn on it.
        // Shading OFF: the original flat disc with a thin ring (unchanged).
        function drawStoneBody(x, y, r, isBlack) {
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fillStyle = createStoneFill(x, y, r, isBlack);

            if (!stoneShadingEnabled) {
                ctx.fill();
                ctx.lineWidth = Math.max(0.6, Math.min(1, r * 0.062));
                ctx.strokeStyle = '#333';
                ctx.stroke();
                return;
            }

            ctx.save();
            // Canvas shadow units ignore the CTM, so scale by DPR to keep the
            // shadow proportional on high-density screens.
            const dpr = window.devicePixelRatio || 1;
            ctx.shadowColor = 'rgba(38, 24, 10, 0.32)';
            ctx.shadowBlur = r * 0.45 * dpr;
            ctx.shadowOffsetY = r * 0.16 * dpr;
            ctx.fill();
            ctx.restore();

            // Hairline rim instead of the hard outline: just enough edge to
            // keep white stones defined against pale board themes.
            ctx.beginPath();
            ctx.arc(x, y, r - 0.25, 0, Math.PI * 2);
            ctx.lineWidth = Math.max(0.5, r * 0.03);
            ctx.strokeStyle = isBlack ? 'rgba(0, 0, 0, 0.2)' : 'rgba(74, 54, 34, 0.28)';
            ctx.stroke();
        }

        function drawStones() {
            if (!state || !boardGeometry) return;
            const { padding, topPadding, cell } = boardGeometry;
            ctx.save();
            
            const allMoves = getRenderedMoves();
            const count = displayMoveCount === -1 ? allMoves.length : displayMoveCount;
            const moves = allMoves.slice(0, count);

            moves.forEach((move, index) => {
                const x = padding + move.x * cell;
                const y = topPadding + move.y * cell;
                const isHighlightedLastMove = displayMoveCount === -1
                    && index === moves.length - 1
                    && lastMoveHighlight
                    && Date.now() < lastMoveHighlight.expiresAt
                    && move.x === lastMoveHighlight.x
                    && move.y === lastMoveHighlight.y
                    && move.number === lastMoveHighlight.number;
                
                drawStoneBody(x, y, cell * 0.45, move.color === 'black');

                if (isHighlightedLastMove) {
                    // Lands with a calm, deep-amber ring and fades out over the
                    // second half. The board itself is amber, so the ring stops
                    // reading below ~0.4 alpha; the eased curve (^0.45) keeps it
                    // inside the visible band for most of the fade window and
                    // lets it slip out already-invisible (no pop).
                    const remainingMs = lastMoveHighlight.expiresAt - Date.now();
                    const fade = Math.pow(Math.max(0, Math.min(0.8, remainingMs / LAST_MOVE_RING_FADE_MS)), 0.45);
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(x, y, cell * 0.5, 0, Math.PI * 2);
                    ctx.lineWidth = Math.max(3, cell * 0.075);
                    ctx.strokeStyle = `rgba(235, 140, 36, ${(0.8 * fade).toFixed(3)})`;
                    ctx.stroke();
                    ctx.restore();
                }

                if (showMoveNumbers) {
                    const moveText = String(index + 1);
                    const moveTextY = y + Math.max(1, Math.round(cell * 0.03));
                    const textLen = moveText.length;
                    // On narrow (phone) widths the board is small, so a bold
                    // weight + thick halo reads as too loud and competes with the
                    // stone pattern. There, use a medium weight, ~90% size and a
                    // thinner halo; keep PC as-is.
                    const narrow = window.innerWidth <= 599;
                    const baseRatio = narrow
                        ? (textLen >= 3 ? 0.27 : (textLen === 2 ? 0.34 : 0.37))
                        : (textLen >= 3 ? 0.3 : (textLen === 2 ? 0.38 : 0.41));
                    // Floor 9px on phones (10px otherwise): small boards clamp
                    // to the floor, so at 10px the narrow size reduction would
                    // never take effect there.
                    const fontSize = Math.max(narrow ? 9 : 10, Math.floor(cell * baseRatio));
                    ctx.font = `${narrow ? 500 : 600} ${fontSize}px 'Segoe UI', 'Yu Gothic UI', Meiryo, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    if (stoneShadingEnabled) {
                        // Shaded stones: no halo — a translucent, ink-like
                        // numeral lets the stone's sheen show through, so the
                        // digit reads as printed on the stone, not pasted on.
                        ctx.fillStyle = move.color === 'black'
                            ? 'rgba(244, 238, 228, 0.85)'
                            : 'rgba(66, 51, 34, 0.8)';
                        ctx.fillText(moveText, x, moveTextY);
                    } else {
                        ctx.fillStyle = move.color === 'black' ? '#eee' : '#333';
                        ctx.lineWidth = narrow ? 1.5 : 2.5;
                        ctx.strokeStyle = move.color === 'black'
                            ? (narrow ? 'rgba(0, 0, 0, 0.4)' : 'rgba(0, 0, 0, 0.55)')
                            : (narrow ? 'rgba(255, 255, 255, 0.72)' : 'rgba(255, 255, 255, 0.9)');
                        ctx.strokeText(moveText, x, moveTextY);
                        ctx.fillText(moveText, x, moveTextY);
                    }
                }
            });

            const canShowPendingMove = pendingMove
                && state.status === 'playing'
                && displayMoveCount === -1
                && !moves.some((move) => move.x === pendingMove.x && move.y === pendingMove.y);
            if (canShowPendingMove) {
                const x = padding + pendingMove.x * cell;
                const y = topPadding + pendingMove.y * cell;
                ctx.save();
                ctx.globalAlpha = 0.7;
                ctx.beginPath();
                ctx.arc(x, y, cell * 0.45, 0, Math.PI * 2);
                ctx.fillStyle = createStoneFill(x, y, cell * 0.45, pendingMove.color === 'black');
                ctx.fill();
                if (showMoveNumbers) {
                    const moveText = String(pendingMove.number);
                    const moveTextY = y + Math.max(1, Math.round(cell * 0.03));
                    ctx.fillStyle = stoneShadingEnabled
                        ? (pendingMove.color === 'black' ? 'rgba(244, 238, 228, 0.85)' : 'rgba(66, 51, 34, 0.8)')
                        : (pendingMove.color === 'black' ? '#eee' : '#333');
                    const textLen = moveText.length;
                    const baseRatio = textLen >= 3 ? 0.3 : (textLen === 2 ? 0.38 : 0.45);
                    const fontSize = Math.max(10, Math.floor(cell * baseRatio));
                    ctx.font = `600 ${fontSize}px 'Segoe UI', 'Yu Gothic UI', Meiryo, sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(moveText, x, moveTextY);
                }
                ctx.restore();
            }

            const canShowConfirmMove = confirmMovePoint
                && displayMoveCount === -1
                && !moves.some((move) => move.x === confirmMovePoint.x && move.y === confirmMovePoint.y);
            if (canShowConfirmMove) {
                const x = padding + confirmMovePoint.x * cell;
                const y = topPadding + confirmMovePoint.y * cell;
                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y, cell * 0.45, 0, Math.PI * 2);
                ctx.lineWidth = Math.max(1.5, cell * 0.045);
                ctx.strokeStyle = 'rgba(42, 42, 42, 0.78)';
                ctx.stroke();
                ctx.restore();
            }
            ctx.restore();
        }

        function renderBoard() {
            if (!boardGeometry) return;
            const { size, padding, topPadding, rightPadding, bottomPadding, coordinateGap, cell } = boardGeometry;
            ctx.clearRect(0, 0, size, size);

            const theme = boardThemes[boardThemeIndex];
            const boardGradient = ctx.createLinearGradient(0, 0, size, size);
            boardGradient.addColorStop(0, theme.grad1);
            boardGradient.addColorStop(1, theme.grad2);
            ctx.fillStyle = boardGradient;
            ctx.fillRect(0, 0, size, size);

            // Faint rim so pale board themes (white / gray) keep an edge
            // against the flat paper background; invisible on wood tones.
            ctx.strokeStyle = 'rgba(74, 54, 34, 0.16)';
            ctx.lineWidth = 1;
            ctx.strokeRect(0.5, 0.5, size - 1, size - 1);

            ctx.save();
            ctx.strokeStyle = 'rgba(63, 42, 19, 0.9)';
            // Scale line width to the cell size so the grid stays light on small
            // (mobile) boards while keeping ~1.2px on desktop. Floor keeps it
            // visible; DPR scaling keeps thin lines crisp.
            const gridLineWidth = Math.max(0.7, cell * 0.028);
            ctx.lineWidth = gridLineWidth;
            for (let line = 0; line < BOARD_SIZE; line += 1) {
                const x = padding + line * cell;
                const y = topPadding + line * cell;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(padding + (BOARD_SIZE - 1) * cell, y);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(x, topPadding);
                ctx.lineTo(x, topPadding + (BOARD_SIZE - 1) * cell);
                ctx.stroke();
            }

            // Slightly thicker outer frame (traditional board look).
            ctx.lineWidth = gridLineWidth * 1.5;
            ctx.strokeRect(padding, topPadding, (BOARD_SIZE - 1) * cell, (BOARD_SIZE - 1) * cell);

            STAR_POINTS.forEach(([x, y]) => {
                ctx.beginPath();
                ctx.fillStyle = 'rgba(51, 33, 17, 0.82)';
                ctx.arc(padding + x * cell, topPadding + y * cell, cell * 0.1, 0, Math.PI * 2);
                ctx.fill();
            });

            if (showCoords) {
                ctx.fillStyle = 'rgba(63, 42, 19, 0.84)';
                ctx.font = `${Math.max(12, Math.floor(cell * 0.34))}px "Yu Gothic UI", Meiryo, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                for (let index = 0; index < BOARD_SIZE; index += 1) {
                    const x = padding + index * cell;
                    const y = topPadding + index * cell;
                    ctx.fillText(LETTERS[index], x, size - bottomPadding + coordinateGap);
                    ctx.fillText(String(BOARD_SIZE - index), padding - coordinateGap, y);
                }
            }
            ctx.restore();

            if ((displayMoveCount === -1 || displayMoveCount === getRenderedMoves().length) && !canUseReviewBoard()) {
                drawConstraintHighlight(phaseDescriptor());
                drawOfferedMoves();
            }
            drawStones();
        }

        function boardPointFromEvent(event) {
            if (!boardGeometry) return null;
            const rect = elements.boardCanvas.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return null;
            const scaleX = boardGeometry.size / rect.width;
            const scaleY = boardGeometry.size / rect.height;
            const x = (event.clientX - rect.left) * scaleX;
            const y = (event.clientY - rect.top) * scaleY;
            
            const { padding, topPadding, cell } = boardGeometry;
            const ix = Math.round((x - padding) / cell);
            const iy = Math.round((y - topPadding) / cell);
            if (ix < 0 || iy < 0 || ix >= BOARD_SIZE || iy >= BOARD_SIZE) return null;
            const px = padding + ix * cell;
            const py = topPadding + iy * cell;
            const hitRadius = Math.max(cell * 0.58, isTouchMain() ? 12 : 0);
            if (Math.hypot(px - x, py - y) > hitRadius) return null;
            return { x: ix, y: iy };
        }

        function handleBoardPointerDown(event) {
            // contextmenu 側で「マウスの右クリックか、タッチの長押しか」を
            // 見分けるために控える（contextmenu が pointerType を持たない
            // 環境があるため）。右ボタンでも pointerdown は来るので、
            // 早期 return より前に記録する。
            lastBoardPointerType = event.pointerType || 'mouse';
            if (event.pointerType === 'mouse' && event.button !== 0) return;
            if (event.isPrimary === false) return;
            event.preventDefault();
            if (!state) return;
            
            if (displayMoveCount !== -1 && displayMoveCount !== getRenderedMoves().length) {
                displayMoveCount = -1;
                clearConfirmMovePoint();
                renderBoard();
                return;
            }

            const point = boardPointFromEvent(event);
            if (!point) {
                clearConfirmMovePoint();
                renderBoard();
                return;
            }
            if (canUseReviewBoard()) {
                confirmOrSendBoardAction('review-move', point);
                return;
            }
            const descriptor = phaseDescriptor();
            if (!descriptor.allowBoardAction) {
                clearConfirmMovePoint();
                renderBoard();
                return;
            }
            if (descriptor.actorPeerId !== localPeerId) {
                clearConfirmMovePoint();
                renderBoard();
                // A spectator has no turn to wait for, so "opponent's turn"
                // would be nonsense for them — they just cannot use the board.
                const seated = isSeatedParticipant(getParticipantById(localPeerId));
                showToast(i18n(seated ? 'errNotYourTurn' : 'errRejected'));
                return;
            }

            if (descriptor.boardActionKind === 'move') {
                if (pendingMove) {
                    clearConfirmMovePoint();
                    renderBoard();
                    return;
                }
                confirmOrSendBoardAction('move', point);
            }
            if (descriptor.boardActionKind === 'offer') {
                confirmOrSendBoardAction('offer', point);
            }
            if (descriptor.boardActionKind === 'select-offer') {
                confirmOrSendBoardAction('select-offer', point);
            }
        }

        // 盤上の右クリックは ＜ と同じ「1手戻す」。盤のどこでも効き、対局中も
        // 検討中も同じ意味になる。タッチの長押しも contextmenu を出すが、
        // 考慮中に指を置いただけで戻るのは事故なので、マウスに限る。
        function handleBoardContextMenu(event) {
            event.preventDefault();
            const pointerType = event.pointerType || lastBoardPointerType;
            if (pointerType && pointerType !== 'mouse') return;
            goMoves(-1);
        }

        const RULE_LABEL = 'Taraguchi-10';

        function formatTimeSetting(minutes, increment) {
            // CJK (分/秒) hugs the number; English (min/sec) needs a space before the unit.
            const u = currentLanguage === 'en' ? ' ' : '';
            return `${minutes}${u}${i18n('minute')} + ${increment}${u}${i18n('second')}`;
        }

        function renderRoomSummary() {
            if (!state) {
                const { baseMinutes, incrementSeconds } = readTimeSettingsFromInputs();
                elements.roomSummary.textContent = `${RULE_LABEL} ・ ${formatTimeSetting(baseMinutes, incrementSeconds)}`;
                elements.roomSummary.hidden = false;
                return;
            }

            ensureSeatClockSettings();
            const left = state.seatClockSettings.black;
            const right = state.seatClockSettings.white;
            const leftText = formatTimeSetting(Math.round(left.baseSeconds / 60), left.incrementSeconds);
            const rightText = formatTimeSetting(Math.round(right.baseSeconds / 60), right.incrementSeconds);
            const timeText = state.timeHandicapEnabled ? `${leftText} / ${rightText}` : leftText;
            elements.roomSummary.textContent = `${RULE_LABEL} ・ ${timeText}`;
            elements.roomSummary.hidden = false;
        }

        let playerNameResizeFrame = 0;

        function updateMobilePlayerNameSize() {
            const players = elements.blackPlayerCard.parentElement;
            if (window.innerWidth > 720) {
                players.style.removeProperty('--mobile-player-name-size');
                return;
            }

            const identities = [
                elements.blackPlayerName,
                elements.whitePlayerName,
                ...(state?.pairRenjuEnabled
                    ? [elements.blackBottomPlayerName, elements.whiteBottomPlayerName]
                    : []),
            ].map((element) => element.closest('.player-identity'));
            const availableWidth = Math.min(...identities.map((identity) => identity.clientWidth));
            if (!availableWidth) return;

            const context = document.createElement('canvas').getContext('2d');
            const style = getComputedStyle(elements.blackPlayerName);
            context.font = `700 100px ${style.fontFamily}`;
            const fitSample = '漢漢漢漢漢漢';
            const sampleWidth = context.measureText(fitSample).width;
            // Overflow guard only: cap at the fluid size the CSS would use, so
            // this var never enlarges names — it only shrinks long ones.
            const fluidPx = Math.max(12, Math.min(15, (boardGeometry?.size || 600) * 0.022));
            const fontSize = Math.max(11, Math.min(fluidPx, Math.floor(availableWidth * 100 / sampleWidth)));
            players.style.setProperty('--mobile-player-name-size', `${fontSize}px`);
        }

        function scheduleMobilePlayerNameSize() {
            cancelAnimationFrame(playerNameResizeFrame);
            playerNameResizeFrame = requestAnimationFrame(updateMobilePlayerNameSize);
        }

        function renderPlayers() {
            const pairEnabled = Boolean(state?.pairRenjuEnabled);
            elements.blackPlayerCard.parentElement.classList.toggle('pair-renju', pairEnabled);
            elements.blackPlayerCard.parentElement.classList.toggle('seats-idle', !state || state.status !== 'playing');
            const seatViews = [
                { seat: 'black', slot: elements.blackPlayerSlot, name: elements.blackPlayerName, status: elements.blackPlayerStatus, ready: elements.blackReadyWrap },
                { seat: 'white', slot: elements.whitePlayerSlot, name: elements.whitePlayerName, status: elements.whitePlayerStatus, ready: elements.whiteReadyWrap },
                { seat: 'blackBottom', slot: elements.blackBottomPlayerSlot, name: elements.blackBottomPlayerName, status: elements.blackBottomPlayerStatus, ready: elements.blackBottomReadyWrap },
                { seat: 'whiteBottom', slot: elements.whiteBottomPlayerSlot, name: elements.whiteBottomPlayerName, status: elements.whiteBottomPlayerStatus, ready: elements.whiteBottomReadyWrap },
            ];
            const activePeerId = state?.clocks?.activePeerId || '';

            function renderParticipant(view, participant) {
                view.name.textContent = participant ? participant.name : i18n('playerNotJoined');
                const disconnected = isParticipantDisconnected(participant);
                // No status text / countdown: a disconnected player only greys
                // their name (via the .disconnected class); play continues.
                view.status.textContent = '';
                view.status.hidden = true;
                view.slot.classList.toggle('disconnected', disconnected);
                view.slot.classList.toggle('self', Boolean(participant && participant.id === localPeerId));
                view.slot.classList.toggle('active', Boolean(participant && participant.id === activePeerId && state?.status === 'playing'));
                renderReadyMark(view.ready, participant);
            }

            // Greying is per-slot (renderParticipant) so only the actual
            // disconnected player dims — in pair renju a teammate stays normal.
            seatViews.forEach((view) => renderParticipant(view, state ? getSeatOccupant(view.seat) : null));

            // First sit on this device: one transient hint about the second
            // tap that marks you ready. Never shown again (readyHintSeen).
            const localSeatNow = getParticipantById(localPeerId)?.seat || '';
            if (localSeatNow !== previousLocalSeat) {
                const satDown = isPlayingSeat(localSeatNow);
                if (satDown && state?.status !== 'playing'
                    && !state?.readyByPeerId?.[localPeerId]
                    && !loadUserSettings().readyHintSeen) {
                    showPresenceToast(i18n('readyHint'));
                    persistUserSettings({ readyHintSeen: true });
                }
                previousLocalSeat = localSeatNow;
            }
            const blackPeerId = getTeamPeerIds('black')[0] || '';
            const whitePeerId = getTeamPeerIds('white')[0] || '';
            elements.blackPlayerTimer.textContent = blackPeerId ? formatTime(getDisplayRemainingMs(blackPeerId)) : '';
            elements.whitePlayerTimer.textContent = whitePeerId ? formatTime(getDisplayRemainingMs(whitePeerId)) : '';
            updateTimerUrgency(elements.blackPlayerTimer, blackPeerId);
            updateTimerUrgency(elements.whitePlayerTimer, whitePeerId);

            if (state) ensureSeatColors();
            const blackCardColor = state?.seatColors?.black || 'black';
            const whiteCardColor = state?.seatColors?.white || 'white';
            elements.blackPlayerCard.classList.toggle('black', blackCardColor === 'black');
            elements.blackPlayerCard.classList.toggle('white', blackCardColor === 'white');
            elements.whitePlayerCard.classList.toggle('black', whiteCardColor === 'black');
            elements.whitePlayerCard.classList.toggle('white', whiteCardColor === 'white');
            elements.blackPlayerCard.classList.toggle(
                'active',
                Boolean(!pairEnabled && state?.status === 'playing' && getTeamForPeer(activePeerId) === 'black')
            );
            elements.whitePlayerCard.classList.toggle(
                'active',

        function renderLog() {
            elements.logList.innerHTML = '';
            const logs = (state?.log || []).filter((entry) => entry.kind === 'presence' || entry.kind === 'comment' || entry.kind === 'system');
            if (!logs.length) {
                const item = document.createElement('li');
                item.className = 'log-item log-item--note';
                item.textContent = i18n('chatNoMessages');
                elements.logList.appendChild(item);
                return;
            }

            // Map current author names to their stone colour for the badge tint.
            const colorByName = {};
            Object.values(state?.participantsById || {}).forEach((p) => {
                if (p && p.name != null) colorByName[p.name] = state.colorsByPeerId?.[p.id] || '';
            });

            logs.forEach((entry, idx) => {
                const item = document.createElement('li');
                // Tiers: human chat (light full-width card) vs game-end result
                // (faint line). Consecutive same-author comments are grouped:
                // the run's first item keeps the name + badge, the rest drop it.
                const isComment = entry.kind === 'comment';
                const isResult = entry.action === 'copy-renjuportal-kifu';
                const author = isComment ? String(entry.text || '').split('\n')[0] : '';
                const prev = logs[idx - 1];
                const grouped = isComment && prev && prev.kind === 'comment'
                    && String(prev.text || '').split('\n')[0] === author;
                item.className = 'log-item ' + (isComment
                    ? ('log-item--chat' + (grouped ? ' log-item--grouped' : ''))
                    : isResult ? 'log-item--result' : 'log-item--note');

                const head = document.createElement('div');
                head.className = 'log-head';
                if (isComment && !grouped) {
                    const color = colorByName[author] || '';
                    const badge = document.createElement('span');
                    badge.className = 'log-avatar'
                        + (color === 'black' ? ' log-avatar--black' : color === 'white' ? ' log-avatar--white' : '');
                    badge.textContent = (splitGraphemes(author)[0] || '?').toUpperCase();
                    head.append(badge);
                    const authorEl = document.createElement('span');
                    authorEl.className = 'log-author';
                    authorEl.textContent = author;
                    head.append(authorEl);
                }

                const body = document.createElement('div');
                body.className = 'log-body';
                let bodyText = entry.kind === 'comment'
                    ? String(entry.text || '').split('\n').slice(1).join('\n')
                    : (entry.messageKey ? i18n(entry.messageKey, entry.messageArg) : entry.text);
                // Prefix the end message with the move count (e.g. "68 手で時間切れです。").
                if (isResult && entry.messageKey && Array.isArray(entry.moves) && entry.moves.length > 0) {
                    bodyText = i18n('movePrefix', entry.moves.length) + bodyText;
                }
                body.textContent = bodyText;
                if (entry.kind === 'system' && entry.action === 'copy-renjuportal-kifu') {
                    const action = document.createElement('button');
                    action.className = 'log-action-button';
                    action.type = 'button';
                    action.textContent = i18n('logKifuCopy');
                    const entryMoves = entry.moves;
                    action.addEventListener('click', () => copyRenjuPortalKifu(entryMoves));
                    body.append(action);
                }

                if (head.childElementCount) item.append(head);
                item.append(body);
                elements.logList.appendChild(item);
            });
            updateLogFade();
        }

        function updateNetworkHeartbeat() {
            if (!peer || typeof peer.setHeartbeatEnabled !== 'function') return;
            const IDLE_HEARTBEAT_TIMEOUT_MS = 10 * 60 * 1000;
            const isPlaying = Boolean(state && state.status === 'playing');
            const isRecentlyActive = lastActivityAt > 0 && (Date.now() - lastActivityAt) < IDLE_HEARTBEAT_TIMEOUT_MS;
            peer.setHeartbeatEnabled(Boolean(state) && (isPlaying || isRecentlyActive));
        }

        function periodicClockWork() {
            if (!state) return;

            if (state.status === 'playing' && state.clocks.activePeerId === localPeerId) {
                const remaining = getDisplayRemainingMs(localPeerId);
                const sec = Math.floor(remaining / 1000);
                if (lastReportedSec !== sec) {
                    if (lastReportedSec !== null && (sec === 10 || (sec <= 5 && sec >= 1))) {
                        playCountdownSound();
                    }
                    lastReportedSec = sec;
                }
            } else {
                lastReportedSec = null;
            }

            // Timeout is judged authoritatively by the Durable Object (alarm +
            // presence-pause + latency grace); the host finalizes on its
            // 'clock-timeout'. No local timeout-finish or per-second clock
            // broadcast here — guests interpolate locally from the last update.

            renderPlayers();
        }

            if (currentOpenControlMenu && currentOpenControlMenu !== name) {

            if (menu.hidden) {
                menu.hidden = false;
                btn.classList.add('active');
                btn.setAttribute('aria-expanded', 'true');
                currentOpenControlMenu = name;
            } else {
                closeControlMenus();

        // どこに打たれたか見失ったときの救済: いま見えている最終手にリングを
        // 出す。自動リング（相手の手のみ）と違い明示的な要求なので、誰の手か
        // は問わない。
        function highlightNewestVisibleMove() {
            const moves = getRenderedMoves();
            if (!moves.length || displayMoveCount !== -1) return;
            startLastMoveHighlight(moves[moves.length - 1]);
            renderBoard();
        }

        function resetMovesView() {
            if (!state) return;
            clearConfirmMovePoint();
            if (canUseReviewBoard()) {
                sendAction({ kind: 'review-branch-base' });
                // 盤はサーバ応答で変わるので、次の状態更新時にハイライトする
                reviewResetHighlightUntil = Date.now() + 1500;
            } else {
                displayMoveCount = -1;
                highlightNewestVisibleMove();
                renderBoard();
            }
        }

        function goMoves(delta) {
            if (!state) return;
            clearConfirmMovePoint();
            if (canUseReviewBoard()) {
                const max = (state.reviewMoves || []).length;
                const current = state.reviewCursor ?? max;
                // 既に最終手で > / >> : 進む先はないので最終手を示す
                if (delta > 0 && current >= max) {
                    highlightNewestVisibleMove();
                    return;
                }
                let next = current + delta;
                if (next < 0) next = 0;
                if (next > max) next = max;
                sendAction({ kind: 'review-cursor', cursor: next });
            } else {
                if (delta > 0 && displayMoveCount === -1) {
                    highlightNewestVisibleMove();
                    return;
                }
                const max = getRenderedMoves().length;
                let current = displayMoveCount === -1 ? max : displayMoveCount;
                current += delta;
                if (current < 0) current = 0;
                if (current >= max) current = -1;
                displayMoveCount = current;
                renderBoard();
            }
        }

                case 'ArrowRight': e.preventDefault(); goMoves(1); break;
                case 'ArrowUp': e.preventDefault(); goMoves(-4); break;
                case 'ArrowDown': e.preventDefault(); goMoves(4); break;
            }
        });

        elements.boardCanvas.addEventListener('pointerdown', handleBoardPointerDown);
        elements.boardCanvas.addEventListener('contextmenu', handleBoardContextMenu);

        window.addEventListener('resize', () => {
            cancelAnimationFrame(resizeFrame);
            resizeFrame = requestAnimationFrame(resizeBoard);
            scheduleMobilePlayerNameSize();
            requestAnimationFrame(updateTimeSeatDividerPosition);
        });


        window.addEventListener('pagehide', () => {
            notifyHostLeaving();
        });
        window.addEventListener('beforeunload', () => {
            notifyHostLeaving();
        });
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState !== 'visible') return;
            scheduleVisibleResyncChecks();
        });

        window.setInterval(periodicClockWork, 250);

        (() => {
            applyCachedUserSettings();

            resizeBoard();
            // Localize all static labels for the saved language, then render
            // (applyLanguage ends with render()). Without this, a non-Japanese
            // saved language still showed Japanese static text after a reload.
            applyLanguage();
        })();
    </script>
</body>
</html>
