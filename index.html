<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f3efe6">
    <title>playren | 対局所</title>
    <style>
        :root {
            --bg: #f3efe6;
            --bg-accent: #e2d5bc;
            --panel: rgba(255, 252, 246, 0.88);
            --panel-strong: #fffaf1;
            --line: rgba(74, 54, 34, 0.18);
            --text: #2f2418;
            --muted: #7b6855;
            --accent: #17594a;
            --accent-strong: #0f4338;
            --accent-soft: rgba(23, 89, 74, 0.12);
            --warn: #a44b1f;
            --danger: #8b2f28;
            --shadow: 0 24px 60px rgba(63, 43, 21, 0.14);
            --radius-xl: 28px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --radius-sm: 10px;
            --shell-padding: clamp(10px, 2vw, 18px);
            color: var(--text);
            font-family: "Yu Gothic UI", "Hiragino Sans", Meiryo, sans-serif;
        }

        html {
            -webkit-touch-callout: none;
            -webkit-font-smoothing: antialiased;
        }

        /* Keyboard focus: one consistent accent ring app-wide. */
        :focus-visible {
            outline: 2px solid rgba(23, 89, 74, 0.55);
            outline-offset: 2px;
        }

        /* Motion preference is honored at each animation's declaration site:
           decorative animations are gated behind (prefers-reduced-motion:
           no-preference). Do NOT add a universal `* { transition-duration }`
           override here — transition-property defaults to `all`, so it turns
           every layout change into a (tiny) async transition and breaks
           resizeBoard's measurements while crossing breakpoints. */
        
        body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.68), transparent 42%),
                linear-gradient(180deg, var(--bg) 0%, var(--bg-accent) 100%);
            padding: clamp(6px, 1.8vw, 18px);
            box-sizing: border-box;
            overscroll-behavior-y: none;
        }

        .app-shell {
            width: min(100%, 1320px);
            margin: 0 auto;
            padding: var(--shell-padding);
            border-radius: 32px;
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        .screen[hidden] {
            display: none !important;
        }

        /* Lobby: one vertically centered composition — board mark, wordmark,
           title, then the join card. No chrome it doesn't need. */
        .lobby-screen {
            position: relative;
            min-height: calc(100dvh - 2 * var(--shell-padding) - 2 * clamp(6px, 1.8vw, 18px));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(22px, 4vh, 34px);
            padding-bottom: 4vh; /* slight lift: optical centre sits above true centre */
            box-sizing: border-box;
        }

        .lobby-hero {
            display: grid;
            justify-items: center;
            gap: 6px;
            text-align: center;
        }

        .lobby-board {
            width: clamp(76px, 12vw, 92px);
            height: auto;
            margin-bottom: 12px;
            filter: drop-shadow(0 14px 26px rgba(63, 43, 21, 0.22));
        }

        .lobby-title {
            margin: 0;
            font-size: clamp(32px, 5vw, 42px);
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: 0.14em;
            text-indent: 0.14em; /* re-center: letter-spacing adds a trailing gap */
        }

        /* Small wordmark above the title: quiet brand identity. */
        .lobby-kicker {
            margin: 0;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.34em;
            text-indent: 0.34em;
            text-transform: lowercase;
            color: var(--muted);
        }

        /* Gentle rise-in when the lobby appears. */
        @media (prefers-reduced-motion: no-preference) {
            .lobby-hero,
            .lobby-grid .panel {
                animation: lobby-rise 0.45s cubic-bezier(0.2, 0.7, 0.3, 1) backwards;
            }

            .lobby-grid .panel {
                animation-delay: 0.08s;
            }

            @keyframes lobby-rise {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
            }
        }

        .lobby-lang-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            min-width: 42px;
            height: 42px;
            padding: 0 12px;
            border: 1px solid rgba(74, 54, 34, 0.12);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.86);
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            font-weight: 800;
            touch-action: manipulation;
            user-select: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.18s ease, background 0.18s ease;
        }

        .lobby-lang-btn:hover {
            background: rgba(255, 255, 255, 1);
            transform: translateY(-1px);
        }

        .language-icon {
            width: 16px;
            height: 16px;
            flex: 0 0 auto;
        }

        .language-code {
            min-width: 2.2em;
            text-align: left;
            letter-spacing: 0;
        }

        .lobby-grid {
            display: flex;
            justify-content: center;
        }
        
        .lobby-grid {
            width: 100%;
        }

        .lobby-grid .panel {
            width: 100%;
            max-width: 372px;
            padding: 22px 22px 16px;
        }

        .lobby-help {
            margin-top: 14px;
            text-align: center;
        }

        .lobby-help-link {
            display: inline-block;
            font-size: 13px;
            color: var(--accent-strong);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .lobby-help-link:hover {
            opacity: 0.8;
        }

        .game-screen {
            display: grid;
            gap: 14px;
        }

        /* Opacity-only fade when entering the room (transform would disturb
           the board-size measurement on first layout). */
        @media (prefers-reduced-motion: no-preference) {
            .game-screen {
                animation: screen-fade 0.3s ease;
            }

            @keyframes screen-fade {
                from { opacity: 0; }
            }
        }

        .game-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .panel,
        .card,
        .player-card {
            border: 1px solid var(--line);
            background: var(--panel);
            backdrop-filter: blur(10px);
        }

        .player-name,
        .section-title,
        .control-main {
            display: block;
            font-weight: 700;
            min-height: 1.5em; 
        }

        .player-meta,
        .card p,
        .game-kicker {
            color: var(--muted);
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1.55fr) minmax(320px, 0.95fr);
            gap: 18px;
        }

        .panel {
            padding: 16px;
            border-radius: var(--radius-xl);
            min-width: 0;
        }

        .field {
            display: grid;
            gap: 6px;
        }

        .field label,
        .card h2 {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .field input {
            width: 100%;
            min-height: 46px;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid rgba(74, 54, 34, 0.12);
            background: rgba(255, 255, 255, 0.85);
            color: var(--text);
            box-sizing: border-box;
        }

        .field input:focus {
            outline: 2px solid rgba(23, 89, 74, 0.25);
            border-color: rgba(23, 89, 74, 0.38);
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .button {
            min-height: 48px;
            padding: 0 16px;
            border-radius: 14px;
            font-weight: 700;
            transition: transform 0.18s ease, opacity 0.18s ease, background 0.18s ease;
            cursor: pointer;
            border: none;
        }

        .button:hover {
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0) scale(0.985);
        }

        .button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .button-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            color: #f9fbf8;
            box-shadow: 0 4px 14px rgba(15, 67, 56, 0.22);
        }

        .button-primary:hover {
            box-shadow: 0 7px 18px rgba(15, 67, 56, 0.26);
        }

        .button-primary:active {
            box-shadow: 0 2px 8px rgba(15, 67, 56, 0.2);
        }

        .button-secondary {
            background: rgba(255, 255, 255, 0.9);
            color: var(--text);
            border: 1px solid rgba(74, 54, 34, 0.12);
        }

        .button-warn {
            background: rgba(164, 75, 31, 0.1);
            color: var(--warn);
            border: 1px solid rgba(164, 75, 31, 0.18);
        }

        .players {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            margin-bottom: 5px;
        }

        .player-card {
            padding: 8px 10px;
            border-radius: var(--radius-md);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .player-card.active {
            border-color: rgba(23, 89, 74, 0.32);
            box-shadow: inset 0 0 0 1px rgba(23, 89, 74, 0.18);
            background: rgba(234, 247, 242, 0.92);
        }

        .player-slot {
            width: 100%;
            min-width: 0;
            border-radius: 10px;
        }

        .players.pair-renju .player-slot.active {
            background: rgba(23, 89, 74, 0.09);
            box-shadow: inset 0 0 0 1px rgba(23, 89, 74, 0.16);
        }

        .player-card.seat-action,
        .player-slot.seat-action,
        .spectator-card.seat-action {
            cursor: pointer;
            touch-action: manipulation;
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .player-card.seat-action:hover,
        .player-slot.seat-action:hover,
        .spectator-card.seat-action:hover {
            border-color: rgba(23, 89, 74, 0.28);
            background: rgba(239, 248, 244, 0.92);
        }

        .player-card.seat-action:active,
        .player-slot.seat-action:active,
        .spectator-card.seat-action:active {
            transform: translateY(1px);
        }

        .players.pair-renju .player-card {
            align-items: stretch;
        }

        .players.pair-renju .player-team-members {
            display: grid;
            grid-template-rows: repeat(2, minmax(0, 1fr));
            flex: 1;
            min-width: 0;
        }

        .players.pair-renju .player-slot + .player-slot {
            border-top: 1px solid rgba(74, 54, 34, 0.1);
            border-radius: 0 0 10px 10px;
        }

        .players.pair-renju .player-head {
            min-height: 34px;
        }

        .players:not(.pair-renju) .player-slot-bottom {
            display: none;
        }

        .player-card.black::before,
        .player-card.white::before {
            content: "";
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            left: 10px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(47, 36, 24, 0.25);
            z-index: 1;
        }

        .player-card.black::before {
            background: #26211e;
        }

        .player-card.white::before {
            background: #f8f5ef;
        }

        .player-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding-left: 24px;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        .player-team-members {
            flex: 1;
            min-width: 0;
        }

        .players.pair-renju .player-timer {
            align-self: center;
        }

        .player-main {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-width: 0;
        }

        .player-name {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-identity {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 4px;
            position: relative;
            overflow: visible;
        }

        .player-status {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 2;
            transform: translate(-50%, -50%);
            padding: 4px 8px;
            border: 1px solid rgba(74, 54, 34, 0.14);
            border-radius: 999px;
            background: rgba(255, 252, 246, 0.94);
            box-shadow: 0 3px 10px rgba(32, 26, 20, 0.12);
            color: var(--text);
            font-size: 11px;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
            pointer-events: none;
        }

        /* Disconnected seated player: just lightly grey the name (the match
           keeps running; the clock and the grey name are the only cues). */
        .player-slot.disconnected .player-name {
            opacity: 0.5;
        }

        .player-timer {
            flex: 0 0 auto;
            font-size: clamp(16px, 2.8vw, 22px);
            font-weight: 800;
            letter-spacing: -0.04em;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s ease;
        }

        /* Time pressure: amber under 10s, red under 5s. Colour only — no
           blinking, so a player under pressure can stay focused on the board. */
        .player-timer.time-low {
            color: var(--warn);
        }

        .player-timer.time-critical {
            color: var(--danger);
        }


        .player-ready {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            align-self: center;
            flex: 0 0 18px;
            width: 18px;
            height: 18px;
        }

        .ready-mark {
            flex: 0 0 18px;
            width: 18px;
            height: 18px;
            aspect-ratio: 1;
            box-sizing: border-box;
            border-radius: 50%;
            border: 1px solid rgba(74, 54, 34, 0.16);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            line-height: 1;
            font-weight: 800;
            color: rgba(47, 36, 24, 0.32);
            background: rgba(255, 255, 255, 0.72);
        }

        .ready-mark.passive {
            opacity: 0.72;
        }

        .ready-mark.active {
            color: #f8fbf8;
            background: linear-gradient(135deg, var(--accent), var(--accent-strong));
            border-color: rgba(23, 89, 74, 0.42);
        }

        /* 透過ダイアログのスタイル */
        .confirm-backdrop {
            position: fixed;
            inset: 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.05);
            z-index: 30;
        }

        @media (prefers-reduced-motion: no-preference) {
            .confirm-backdrop {
                animation: dialog-fade 0.16s ease-out;
            }

            /* Opacity only: the card is positioned via transform, so animating
               transform here would knock it out of place. */
            @keyframes dialog-fade {
                from { opacity: 0; }
            }
        }

        .confirm-card {
            width: auto;
            min-width: 240px;
            max-width: min(100%, 360px);
            padding: 16px;
            border-radius: 20px;
            border: 1px solid rgba(74, 54, 34, 0.1);
            background: rgba(255, 252, 246, 0.65);
            backdrop-filter: blur(2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: grid;
            gap: 14px;
            position: fixed;
            left: var(--confirm-dialog-x, 50vw);
            top: var(--confirm-dialog-y, 50vh);
            transform: translate(-50%, -100%);
        }

        .confirm-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .confirm-message {
            margin: 0;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-line; /* honor the \n line break in the message */
        }

        #timeSettingsDialog {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: hidden;
            overscroll-behavior: contain;
        }

        #timeSettingsDialog[hidden] {
            display: none;
        }

        .time-settings-card {
            width: max-content;
            min-width: 0;
            max-width: calc(100vw - 24px);
            max-height: calc(100vh - 24px);
            max-height: calc(100dvh - 24px);
            padding: 16px;
            background: rgba(255, 252, 246, 0.94);
            backdrop-filter: blur(10px);
            box-sizing: border-box;
            overflow-y: auto;
            overscroll-behavior: contain;
            position: relative;
            left: auto;
            top: auto;
            transform: none;
        }

        .time-settings-form {
            display: grid;
            gap: 14px;
        }

        .time-handicap-row {
            width: fit-content;
            min-height: 24px;
            padding: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10px;
            font-weight: 700;
            color: var(--muted);
            cursor: pointer;
        }

        .time-handicap-row input {
            width: 12px;
            height: 12px;
            margin: 0;
            accent-color: var(--accent);
        }

        .time-seat-grid {
            display: grid;
            grid-template-columns: max-content max-content max-content;
            align-items: center;
            gap: 10px 12px;
            position: relative;
        }

        .time-seat-grid.single {
            grid-template-columns: max-content max-content;
        }

        .time-seat-grid.single .time-control-cell {
            grid-column: 2;
        }

        .time-seat-grid.single .time-base-label,
        .time-seat-grid.single .time-base-control {
            grid-row: 1;
        }

        .time-seat-grid.single .time-increment-label,
        .time-seat-grid.single .time-increment-control {
            grid-row: 2;
        }

        .time-seat-divider {
            position: absolute;
            left: var(--time-divider-x, 50%);
            top: 0;
            bottom: 0;
            width: 1px;
            transform: translateX(-0.5px);
            background: rgba(74, 54, 34, 0.14);
            pointer-events: none;
        }

        .time-seat-grid.single .time-seat-divider {
            display: none;
        }

        .time-seat-title {
            grid-row: 1;
            text-align: center;
            font-size: 12px;
            font-weight: 800;
            color: var(--text);
        }

        #uiTimeLeftLabel {
            grid-column: 2;
        }

        #uiTimeRightLabel {
            grid-column: 3;
        }

        .time-row-label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .time-base-label,
        .time-base-control {
            grid-row: 2;
        }

        .time-increment-label,
        .time-increment-control {
            grid-row: 3;
        }

        .time-row-label {
            grid-column: 1;
        }

        .time-left-control {
            grid-column: 2;
        }

        .time-right-control {
            grid-column: 3;
        }

        .time-stepper {
            display: grid;
            grid-template-columns: 30px 4em 30px auto;
            align-items: center;
            justify-content: start;
            column-gap: 3px;
        }

        .time-stepper input {
            width: 100%;
            max-width: none;
            min-height: 34px;
            padding: 6px 10px 6px 3px;
            border-radius: 10px;
            border: 1px solid rgba(74, 54, 34, 0.14);
            background: rgba(255, 255, 255, 0.9);
            color: var(--text);
            box-sizing: border-box;
            text-align: right;
            font-weight: 700;
            appearance: textfield;
        }

        .time-stepper input::-webkit-inner-spin-button,
        .time-stepper input::-webkit-outer-spin-button {
            margin: 0;
            appearance: none;
        }

        .time-step-button {
            width: 30px;
            height: 34px;
            padding: 0;
            border-radius: 10px;
            border: 1px solid rgba(74, 54, 34, 0.14);
            background: rgba(255, 255, 255, 0.9);
            color: var(--text);
            font-size: 18px;
            font-family: inherit;
            line-height: 1;
            font-weight: 500;
            cursor: pointer;
            touch-action: manipulation;
        }

        .time-step-button:active {
            background: rgba(23, 89, 74, 0.1);
        }

        .time-step-button:disabled {
            cursor: not-allowed;
            opacity: 0.4;
        }

        .time-unit {
            margin-left: 6px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            min-width: 1.8em;
        }

        .time-settings-card > .confirm-actions {
            justify-content: flex-end;
            padding-top: 12px;
            border-top: 1px solid rgba(74, 54, 34, 0.08);
        }

        @media (max-width: 480px) {
            .time-seat-grid {
                grid-template-columns: repeat(2, max-content);
                gap: 7px 8px;
            }

            .time-base-label {
                grid-column: 1 / -1;
                grid-row: 2;
            }

            .time-base-control {
                grid-row: 3;
            }

            .time-increment-label {
                grid-column: 1 / -1;
                grid-row: 4;
            }

            .time-increment-control {
                grid-row: 5;
            }

            .time-seat-grid.single {
                grid-template-columns: max-content;
            }

            .time-seat-grid.single .time-row-label,
            .time-seat-grid.single .time-control-cell {
                grid-column: 1;
            }

            .time-seat-grid.single .time-base-label {
                grid-row: 1;
            }

            .time-seat-grid.single .time-base-control {
                grid-row: 2;
            }

            .time-seat-grid.single .time-increment-label {
                grid-row: 3;
            }

            .time-seat-grid.single .time-increment-control {
                grid-row: 4;
            }
        }

        @media (max-width: 340px) {
            .time-settings-card {
                padding: 12px;
            }

            .time-seat-grid {
                gap: 8px 6px;
            }

            .time-stepper {
                grid-template-columns: 28px 3.6em 28px auto;
            }

            .time-stepper input {
                width: 100%;
                max-width: none;
            }

            .time-step-button {
                width: 28px;
            }

            .time-unit {
                min-width: 1.4em;
            }
        }

        /* 盤面コンテナ（歪み防止の核） */
        .board-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .board-wrap {
            position: relative;
            border-radius: 26px;
            overflow: visible;
            padding: 0;
            box-sizing: border-box;
            background: transparent;
            box-shadow: none;
        }

        #boardCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
            touch-action: none; /* ズーム等を防ぐ */
        }

        .board-controls {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
            align-items: center;
            margin-top: 5px;
            padding: 8px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(10px);
        }

        .ctrl-left, .ctrl-center, .ctrl-right { display: flex; align-items: center; }
        .ctrl-left, .ctrl-right { gap: 6px; }
        .ctrl-center { gap: 6px; justify-content: center; min-width: 0; }
        .control-menu { position: relative; }
        
        .board-controls button {
            padding: 10px 12px;
            border: 1px solid rgba(74, 54, 34, 0.12);
            background: rgba(255, 255, 255, 0.85);
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            touch-action: manipulation;
            white-space: nowrap;
            user-select: none;
            color: var(--text);
            transition: transform 0.18s ease, background 0.18s ease;
        }
        .board-controls button:hover { background: rgba(255, 255, 255, 1); transform: translateY(-1px); }
        .board-controls button:active { transform: scale(0.95); }
        .board-controls button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
        
        .menu-icon-btn {
            width: 42px; height: 42px; padding: 0; display: inline-flex; align-items: center; justify-content: center;
        }
        .menu-icon-btn.active { background: rgba(23, 89, 74, 0.1); border-color: rgba(23, 89, 74, 0.38); color: var(--accent-strong); }
        .control-icon { display: inline-flex; width: 22px; height: 22px; }
        .control-icon svg { width: 100%; height: 100%; fill: currentColor; }
        .control-menu-popup {
            position: absolute; bottom: calc(100% + 8px); min-width: 144px; display: flex; flex-direction: column; gap: 0;
            padding: 5px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255, 252, 246, 0.98);
            box-shadow: var(--shadow); z-index: 20;
        }
        @media (prefers-reduced-motion: no-preference) {
            .control-menu-popup {
                transform-origin: bottom center;
                animation: menu-pop 0.16s cubic-bezier(0.2, 0.8, 0.3, 1);
            }
            @keyframes menu-pop {
                from { opacity: 0; transform: translateY(5px) scale(0.97); }
            }
        }
        .control-menu-popup[hidden] { display: none !important; }
        .control-menu.align-right .control-menu-popup { right: 0; }
        .control-menu:not(.align-right) .control-menu-popup { left: 0; }
        .control-menu-divider { height: 1px; margin: 4px 10px; background: rgba(74, 54, 34, 0.12); }
        .control-menu-divider[hidden] { display: none; }
        
        .board-controls .control-menu-item {
            width: 100%; text-align: left; padding: 12px 14px; font-size: 13px; font-weight: 600;
            color: var(--text); background: transparent; border: none; box-shadow: none; border-radius: 10px; outline: none;
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
        }
        .board-controls .control-menu-item:hover { background: rgba(23, 89, 74, 0.08); transform: none; }
        .board-controls .control-menu-item::after { content: ''; width: 1em; flex: 0 0 1em; }
        .board-controls .control-menu-item.active::after { content: '✓'; color: var(--muted); }
        .board-controls .control-menu-item.board-theme-item::after,
        .board-controls .control-menu-item[data-value]::after { content: attr(data-value); width: auto; flex: 0 0 auto; color: var(--muted); }
        .board-controls .control-menu-item.language-menu-item::after { content: none; display: none; }
        .control-menu-value {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            font-weight: 700;
        }
        .board-controls .language-menu-item .control-menu-value {
            margin-left: auto;
            justify-content: flex-end;
        }
        .board-controls .language-menu-item .language-code {
            min-width: 0;
            text-align: right;
        }
        
        .nav-btn {
            padding: 0; display: inline-flex; align-items: center; justify-content: center;
            text-align: center; line-height: 1; height: 42px;
        }
        /* Step (single move) is tapped the most and gets the widest target;
           reset (jump to latest) sits in between; branch (±4) keeps its
           original width. */
        .nav-btn.branch { width: 3.5em; letter-spacing: -0.08em; }
        .nav-btn.step { width: 4.6em; }
        .nav-btn.reset { width: 3.8em; }

        .sidebar {
            display: grid;
            gap: 14px;
            align-content: start;
            min-width: 0;
        }

        .card {
            padding: 16px;
            border-radius: var(--radius-xl);
        }

        /* One surface for the whole sidebar: sections separated by hairlines
           and whitespace instead of nested boxes. */
        .card.sidebar-card {
            padding: 0;
            overflow: hidden; /* clip section hover tint to the rounded corners */
        }

        .side-section {
            padding: 14px 16px;
            min-width: 0;
        }

        .side-section + .side-section {
            border-top: 1px solid rgba(74, 54, 34, 0.1);
        }

        .card h2 {
            margin: 0 0 12px;
            font-size: 15px;
        }

        .card p {
            margin: 0;
            line-height: 1.65;
            font-size: 14px;
        }

        .info-card {
            display: grid;
            gap: 12px;
        }

        .info-topline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        #roomSummary {
            padding-left: 0;
            font-size: 13.5px;
        }

        .compact-time-editor {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .compact-time-editor input {
            width: 4.2em;
            min-height: 34px;
            padding: 6px 8px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
        }

        .compact-time-editor span {
            color: var(--muted);
            font-size: 13px;
        }

        .spectator-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            align-content: start;
            gap: 8px;
            max-height: 88px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .spectator-item {
            padding: 3px 0;
            margin: 0;
            font-size: 13.5px;
            box-sizing: border-box;
        }

        .move-list,
        .log-list {
            list-style: none;
            margin: 0;
            display: grid;
            align-content: start; /* ここで縦に伸びるのを防ぐ */
            gap: 10px;
            max-height: 260px;
            overflow: auto;
            /* left inset lines the chat badges up with the compose badge */
            padding: 0 4px 0 12px;
        }

        .move-item {
            padding: 10px 12px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.62);
            border: 1px solid rgba(74, 54, 34, 0.08);
        }

        /* Log rows are flat: whitespace does the separating, not boxes. */
        .log-item {
            padding: 2px 0;
        }

        .log-item {
            display: grid;
            gap: 4px;
        }

        /* Human chat: a plain full-width row. */
        .log-item--chat {
            justify-self: stretch;
        }

        /* Indent the message under the name, leaving the badge gutter on the
           left (badge 20px + 8px gap), so a group lines up in one column. */
        .log-item--chat .log-body {
            padding-left: 28px;
        }

        /* Consecutive messages from the same author drop the name header and
           tuck in close, so a run reads as one grouped block. */
        .log-item--grouped {
            margin-top: -6px;
        }

        /* Initial badge tinted by the author's stone colour (spectator = neutral). */
        .log-avatar {
            flex: 0 0 auto;
            box-sizing: border-box;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10.5px;
            font-weight: 700;
            line-height: 1;
            background: var(--muted);
            color: #fff;
            border: 1px solid transparent;
        }

        .log-avatar--black {
            background: #20201e;
            color: #f3efe8;
            border-color: rgba(0, 0, 0, 0.25);
        }

        .log-avatar--white {
            background: #f7f4ee;
            color: #2f2418;
            border-color: rgba(74, 54, 34, 0.32);
        }

        /* The compose badge is decorative; keep it fainter than the chat badges
           so the input stays the focus. */
        #composeAvatar {
            opacity: 0.35;
        }

        /* Join / leave / reconnect / disconnect: faint left-aligned note line. */
        .log-item--note {
            justify-self: stretch;
            padding: 2px 4px 2px 0;
            color: var(--muted);
        }

        .log-item--note .log-body {
            font-size: 12px;
            line-height: 1.4;
            color: var(--muted);
        }

        .log-item--note .log-body::before {
            content: "·";
            margin-right: 6px;
            opacity: 0.7;
        }

        /* Game end / timeout / draw: a light left line (no card), but the result
           text stays readable so the outcome isn't demoted to a faint note.
           Left padding matches the chat badge edge (12px) so it lines up. */
        .log-item--result {
            justify-self: stretch;
            padding: 3px 6px 3px 0;
        }

        .log-item--result .log-body {
            font-size: 13px;
            font-weight: 400;
            color: var(--text);
        }

        .log-head {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .log-body {
            font-size: 14px;
            line-height: 1.55;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .log-action-button {
            appearance: none;
            margin-left: 8px;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }

        .log-action-button:hover {
            color: var(--accent-strong);
        }

        /* Compose sits at the top (messages grow upward), kept understated: a
           soft pill with the user's stone-colour badge, a borderless input and
           a muted send that only lights up on hover. */
        .log-compose {
            margin: 0 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            /* left padding matches the chat item padding (12px) so the compose
               badge and input line up vertically with the chat badges/messages */
            padding: 4px 6px 4px 12px;
            border-radius: 999px;
            background: rgba(74, 54, 34, 0.055);
            border: 0;
            transition: background 0.18s ease, box-shadow 0.18s ease;
        }

        .log-compose:focus-within {
            background: rgba(255, 255, 255, 0.8);
            box-shadow: inset 0 0 0 1px rgba(23, 89, 74, 0.25);
        }

        /* Send only lights up once there is something to send. */
        .log-compose.has-text .log-send {
            color: var(--accent);
        }

        .log-compose input {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 30px;
            padding: 2px;
            border: 0;
            background: transparent;
            color: var(--text);
            font-size: 13px;
        }

        .log-compose input:focus {
            outline: none;
        }

        .log-compose input::placeholder {
            color: var(--muted);
        }

        .log-send {
            flex: 0 0 auto;
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 12.5px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 999px;
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .log-send:hover {
            color: var(--accent);
        }

        .log-author {
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 0.02em;
            color: var(--muted);
        }

        .toast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            min-width: 260px;
            max-width: min(420px, calc(100vw - 36px));
            padding: 14px 16px;
            border-radius: 16px;
            background: rgba(32, 26, 20, 0.9);
            color: #f8f5ef;
            box-shadow: 0 18px 36px rgba(24, 17, 12, 0.28);
            opacity: 0;
            transform: translateY(14px);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 20;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Light, stacked presence toasts (join / leave / disconnect / reconnect),
           kept distinct and subtler than the bottom-right info/error toast. */
        .presence-toasts {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 19;
            pointer-events: none;
        }

        .presence-toast {
            max-width: min(360px, calc(100vw - 32px));
            padding: 5px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--muted);
            border: 1px solid var(--line);
            font-size: 12.5px;
            box-shadow: 0 6px 16px rgba(24, 17, 12, 0.12);
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .presence-toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .mono {
            font-family: Consolas, "Courier New", monospace;
            letter-spacing: 0.02em;
        }

        /* PC画面幅 (1081px以上) のレイアウト: スクロールさせず1画面に収める */
        @media (min-width: 1081px) {
            html, body {
                height: 100%;
                overflow: hidden;
            }
            body {
                padding: 4px;
            }
            .app-shell {
                height: 100%;
                display: flex;
                flex-direction: column;
                padding: 8px;
            }
            .game-screen {
                flex: 1;
                min-height: 0;
                display: grid;
                grid-template-rows: minmax(0, 1fr);
            }
            .layout {
                min-height: 0;
                align-items: center;
                gap: 12px;
                height: 100%;
            }
            .panel {
                padding: 12px;
            }
            .layout > .panel:first-child {
                display: flex;
                flex-direction: column;
                min-height: 0;
                height: min(100%, 820px);
                max-height: calc(100vh - 24px);
                justify-content: center;
                gap: 8px;
            }
            .players, .board-controls {
                flex: 0 0 auto;
            }
            .board-container {
                flex: 0 1 auto;
                min-height: 0;
                height: min(calc(100vh - 150px), 680px);
                max-height: 680px;
                aspect-ratio: 1 / 1;
            }
            .sidebar .card h2 {
                display: none !important;
            }
            .sidebar {
                display: flex;
                flex-direction: column;
                min-height: 0;
                max-height: min(calc(100vh - 24px), 760px);
                overflow-y: auto; 
            }
            .sidebar > .sidebar-card {
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            /* Chat keeps a stable height so the sidebar balances the board;
               the list fills it and scrolls internally. */
            .side-chat {
                height: 420px;
                flex: 0 1 auto;
                display: flex;
                flex-direction: column;
                min-height: 0;
            }
            .side-chat .log-list {
                flex: 1 1 auto;
                max-height: none;
                overflow-y: auto;
            }
        }

        /* スマホ・タブレット縦など (1080px以下) */
        @media (min-width: 1081px) and (max-width: 1280px) and (orientation: landscape) {
            .layout > .panel:first-child {
                gap: 6px;
            }
            .players {
                gap: 6px;
                margin-bottom: 4px;
            }
            .player-card {
                padding: 4px 8px;
            }
            .player-head {
                gap: 6px;
                padding-left: 18px;
            }
            .player-card.black::before,
            .player-card.white::before {
                left: 7px;
                width: 7px;
                height: 7px;
            }
            .player-name {
                font-size: 11px;
                min-height: 1.1em;
            }
            .player-main {
                gap: 5px;
            }
            .player-timer {
                font-size: 15px;
            }
            .ready-mark {
                width: 22px;
                height: 22px;
                font-size: 12px;
            }
            .board-container {
                height: min(calc(100vh - 108px), 660px);
                max-height: 660px;
            }
        }

        @media (max-width: 1080px) {
            .layout {
                grid-template-columns: 1fr;
                /* Stacked: halve the gap between the board panel and the chat. */
                row-gap: 9px;
            }
            .sidebar .card h2 {
                display: none !important;
            }
            .board-container {
                aspect-ratio: 1 / 1;
            }
        }

        /* スマホ向けレイアウト */
        @media (min-width: 721px) and (max-width: 1080px) {
            /* Trim the gap above the board (app top → rectangle) to about half;
               only the top side, so left/right/bottom spacing is unchanged. */
            body {
                padding-top: clamp(3px, 0.9vw, 9px);
            }
            .app-shell {
                padding-top: clamp(5px, 1vw, 9px);
            }
            .players,
            .board-controls {
                width: min(100%, 680px);
                max-width: 680px;
                margin-left: auto;
                margin-right: auto;
            }
            .board-container {
                width: min(100%, 680px);
                max-width: 680px;
                margin: 0 auto;
            }
            /* Name/timer sizing was landscape-only, so iPad PORTRAIT inherited a
               large default and the seat card grew on sit. Apply to both orients. */
            .player-name {
                font-size: 12px;
                min-height: 1.1em;
            }
            .player-timer {
                font-size: 16px;
            }
        }

        @media (min-width: 721px) and (max-width: 1080px) and (orientation: landscape) {
            .players {
                gap: 6px;
                margin-bottom: 4px;
            }
            .player-card {
                padding: 4px 8px;
            }
            .player-head {
                gap: 6px;
                padding-left: 18px;
            }
            .player-card.black::before,
            .player-card.white::before {
                left: 7px;
                width: 7px;
                height: 7px;
            }
            .player-name {
                font-size: 11px;
                min-height: 1.1em;
            }
            .player-main {
                gap: 5px;
            }
            .player-timer {
                font-size: 15px;
            }
            .ready-mark {
                width: 22px;
                height: 22px;
                font-size: 12px;
            }
        }

        @media (max-width: 720px) {
            body { padding: 0; }
            .app-shell {
                width: 100%;
                margin: 0 auto;
                padding: 6px;
                border-radius: 0;
            }

            .game-screen .layout > .panel:first-child {
                background: transparent;
                border: none;
                padding: 0;
                border-radius: 0;
                box-shadow: none;
            }

            .panel,
            .card {
                padding: 12px;
                border-radius: 18px;
            }

            .players {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 6px;
                margin-bottom: 8px;
                padding: 0 4px;
            }

            .layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                grid-template-columns: 1fr;
                padding: 0 4px;
            }

            .info-topline {
                align-items: stretch;
            }

            .board-wrap {
                border-radius: 18px;
            }

            .player-card {
                min-width: 0;
                padding: 6px 8px; /* 縦幅を小さく */
                gap: 4px;
            }

            .player-head {
                gap: 4px;
                padding-left: 20px;
            }

            .player-main {
                gap: 4px;
            }

            .player-identity {
                gap: 3px;
            }

            .player-card.black::before,
            .player-card.white::before {
                left: 6px;
                width: 8px;
                height: 8px;
            }

            .player-name {
                font-size: var(--mobile-player-name-size, 12px);
                line-height: 1.2;
                min-height: 0;
            }

            .player-status {
                padding: 4px 7px;
                font-size: 10px;
            }

            .player-timer {
                font-size: clamp(11px, 3.2vw, 14px);
                line-height: 1;
            }

            .player-ready {
                flex-basis: 16px;
                width: 16px;
                height: 16px;
            }
            
            .ready-mark {
                flex-basis: 16px;
                width: 16px;
                height: 16px;
                font-size: 9px;
            }

            .game-topbar {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .board-controls { padding: 6px; gap: 4px; margin-top: 4px; border-radius: 12px; }
            .menu-icon-btn { width: 42px; height: 42px; }
            .nav-btn { height: 42px; }
            /* When space runs out (<360px), let the rarely-used ±4 buttons
               give way first so the primary ＜/＞ keep the biggest target. */
            .nav-btn.branch { width: 2.8em; min-width: 0; }
            .nav-btn.step { width: 3.6em; min-width: 3em; }
            .nav-btn.reset { width: 3em; min-width: 2.6em; }

            .toast {
                right: 10px;
                left: 10px;
                bottom: 10px;
                min-width: 0;
                max-width: none;
            }
        }
    </style>
</head>

    <div class="app-shell">
        <section id="lobbyScreen" class="screen lobby-screen">
            <button id="lobbyLangBtn" class="lobby-lang-btn" type="button" aria-label="言語">
                <svg class="language-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M2 12h20"></path>
                    <path d="M12 2a15.3 15.3 0 0 1 0 20"></path>
                    <path d="M12 2a15.3 15.3 0 0 0 0 20"></path>
                </svg>
                <span class="language-code">JA</span>
            </button>

            <div class="lobby-hero">
                <svg class="lobby-board" viewBox="0 0 96 96" aria-hidden="true">
                    <defs>
                        <linearGradient id="lobbyWood" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#e3c98c"></stop>
                            <stop offset="1" stop-color="#bc8f51"></stop>

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                if (!audioResumePromise) {
                    audioResumePromise = audioCtx.resume()
                        .catch(() => {})
                        .finally(() => {
                            audioResumePromise = null;
                        });
                }
            }
            return audioCtx;
        }

        function initStoneSound() {
            if (stoneSoundPool.length || !window.Audio) return;
            stoneSoundPool = Array.from({ length: STONE_SOUND_POOL_SIZE }, () => {
                return createStoneAudioElement();
            });
        }

        function initNotificationSound() {
            if (notificationSoundPool.length || !window.Audio) return;
            notificationSoundPool = Array.from({ length: NOTIFICATION_SOUND_POOL_SIZE }, () => {
                return createNotificationAudioElement();
            });
        }

        function createStoneAudioElement() {
            const sound = new Audio(STONE_SOUND_SRC);
            sound.preload = 'auto';
            return sound;
        }

        function createNotificationAudioElement() {
            const sound = new Audio(NOTIFICATION_SOUND_SRC);
            sound.preload = 'auto';
            return sound;
        }

        function decodeAudioDataCompat(arrayBuffer) {
            return new Promise((resolve, reject) => {
                const decoded = audioCtx.decodeAudioData(arrayBuffer, resolve, reject);
                if (decoded && typeof decoded.then === 'function') {
                    decoded.then(resolve, reject);
                }
            });
        }

        function ensureStoneSoundBuffer() {
            if (!audioCtx || stoneSoundBuffer || stoneSoundBufferPromise) return;
            stoneSoundBufferPromise = fetch(STONE_SOUND_SRC)
                .then((response) => {
                    if (!response.ok) throw new Error(`stone sound load failed: ${response.status}`);
                    return response.arrayBuffer();
                })
                .then(decodeAudioDataCompat)
                .then((buffer) => {
                    stoneSoundBuffer = buffer;
                    return buffer;
                })
                .catch(() => {
                    stoneSoundBufferPromise = null;
                    return null;
                });
        }

        function primeAudioFromUserGesture() {
            if (!soundEnabled) return;
            initAudio();
            ensureStoneSoundBuffer();
            initStoneSound();
            initNotificationSound();
            stoneSoundPool.forEach((sound) => {
                try { sound.load(); } catch (error) {}
            });
            notificationSoundPool.forEach((sound) => {
                try { sound.load(); } catch (error) {}
            });
        }

        ['pointerdown', 'click', 'keydown', 'touchend'].forEach((eventName) => {
            document.body.addEventListener(eventName, primeAudioFromUserGesture, { capture: true, passive: true });
        });

        function playStoneSoundBuffer() {
            if (!audioCtx || !stoneSoundBuffer || audioCtx.state !== 'running') return false;
            const source = audioCtx.createBufferSource();
            const gain = audioCtx.createGain();
            source.buffer = stoneSoundBuffer;
            gain.gain.value = 1;
            source.connect(gain);
            gain.connect(audioCtx.destination);
            source.start();
            return true;
        }

        function playStoneSoundFallback() {
            initStoneSound();
            if (!stoneSoundPool.length) return;
            let sound = stoneSoundPool.find((item) => item.paused || item.ended);
            if (!sound && stoneSoundPool.length < STONE_SOUND_POOL_MAX) {
                sound = createStoneAudioElement();
                stoneSoundPool.push(sound);
            }
            if (!sound) return;
            try {
                sound.currentTime = 0;
            } catch (error) {
                // iOS may reject currentTime before metadata is available; play from the start anyway.
            }
            sound.play().catch(() => {});
        }

        function playNotificationSoundFile() {
            initNotificationSound();
            if (!notificationSoundPool.length) return;
            let sound = notificationSoundPool.find((item) => item.paused || item.ended);
            if (!sound && notificationSoundPool.length < NOTIFICATION_SOUND_POOL_MAX) {
                sound = createNotificationAudioElement();
                notificationSoundPool.push(sound);
            }
            if (!sound) return;
            try {
                sound.currentTime = 0;
            } catch (error) {
                // iOS may reject currentTime before metadata is available; play from the start anyway.
            }
            sound.play().catch(() => {});
        }

        function playStoneSound(isSelf) {
            if (!soundEnabled) return;
            initAudio();
            ensureStoneSoundBuffer();
            if (playStoneSoundBuffer()) return;
            playStoneSoundFallback();
        }

        function playCountdownSound() {
            if (!soundEnabled) return;
            initAudio();
            playNotificationSoundFile();
        }

        function playActionNotificationSound() {
            if (!soundEnabled) return;
            initAudio();
            playNotificationSoundFile();
        }

        function sanitizeName(value) {
            const fallback = 'Player';
            const trimmed = String(value || '').trim().replace(/\s+/g, ' ');
            return trimmed || fallback;
        }

        function splitGraphemes(value) {
            const text = String(value || '');
            if (typeof Intl?.Segmenter === 'function') {
                const segmenter = new Intl.Segmenter(undefined, { granularity: 'grapheme' });
                return Array.from(segmenter.segment(text), ({ segment }) => segment);
            }
            return Array.from(text);
        }

        function isHalfWidthGrapheme(grapheme) {
            let hasBaseCharacter = false;
            for (const character of Array.from(grapheme)) {
                if (/\p{Mark}/u.test(character) || character === '\u200d' || character === '\ufe0f') continue;
                hasBaseCharacter = true;
                const codePoint = character.codePointAt(0);
                const isHalfWidth = codePoint <= 0x7f
                    || (codePoint >= 0xff61 && codePoint <= 0xff9f)
                    || (codePoint >= 0xffa0 && codePoint <= 0xffdc);
                if (!isHalfWidth) return false;
            }
            return hasBaseCharacter;
        }

        function getTextWidthUnits(value) {
            return splitGraphemes(value).reduce(
                (total, grapheme) => total + (isHalfWidthGrapheme(grapheme) ? 1 : 2),
                0
            );
        }

        function createToken() {

        function getLocalPlayerToken(roomCode) {
            const storageKey = `${PLAYER_TOKEN_PREFIX}${roomCode}`;
            try {
                const existing = window.localStorage.getItem(storageKey);
                if (existing) return existing;
                const nextToken = createToken();
                window.localStorage.setItem(storageKey, nextToken);
                return nextToken;
            } catch (error) {
                return createToken();
            }
        }

        function normalizeUserSettings(settings) {
            const defaults = getDefaultUserSettings();
            const next = { ...defaults, ...(settings || {}) };
            next.displayName = String(next.displayName || '').slice(0, 24);
            next.roomCode = String(next.roomCode || '').slice(0, 24);
            const baseMinutes = Number(next.baseMinutes);
            const incrementSeconds = Number(next.incrementSeconds);
            next.baseMinutes = clamp(Number.isFinite(baseMinutes) && baseMinutes > 0 ? baseMinutes : defaults.baseMinutes, 1, 180);
            next.incrementSeconds = clamp(Number.isFinite(incrementSeconds) ? incrementSeconds : defaults.incrementSeconds, 0, 60);
            next.soundEnabled = next.soundEnabled !== false;
            next.showCoords = next.showCoords !== false;
            next.showMoveNumbers = next.showMoveNumbers !== false;
            next.moveConfirmEnabled = next.moveConfirmEnabled === true;
            next.stoneShading = next.stoneShading === true;
            next.boardThemeIndex = clamp(Number(next.boardThemeIndex) || 0, 0, boardThemes.length - 1);
            next.language = ['ja', 'zh', 'en'].includes(next.language) ? next.language : 'ja';
            return next;
        }

        function loadUserSettings() {

        function persistUserSettings(overrides = {}) {
            const current = loadUserSettings();
            const next = normalizeUserSettings({ ...current, ...overrides });
            try {
                window.localStorage.setItem(USER_SETTINGS_STORAGE_KEY, JSON.stringify(next));

            return { baseMinutes, incrementSeconds };

        async function copyTextToClipboard(text) {
            if (navigator.clipboard?.writeText) {
                try {
                    await navigator.clipboard.writeText(text);
                    return;
                } catch (_error) {
                    // Some mobile browsers expose Clipboard API but reject it.
                    // Fall through to the selection-based copy path.
                }
            }

            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.setAttribute('readonly', 'readonly');
            textarea.style.position = 'fixed';
            textarea.style.top = '0';
            textarea.style.left = '0';
            textarea.style.width = '1px';
            textarea.style.height = '1px';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            textarea.setSelectionRange(0, textarea.value.length);

            try {
                const copied = document.execCommand('copy');
                if (!copied) throw new Error('copy failed');
            } finally {
                document.body.removeChild(textarea);
            }
        }

        function clearReconnectTimer() {

        function scheduleReconnect(delayMs = 800) {
            if (sessionTerminated) return;

        // Single entry point for joining/reconnecting. The server (Durable
        // Object) owns the game and reports presence; this client just adopts
        // the broadcast state and relayed messages.
        function connectToRoom() {
            if (!roomId || !localPlayerToken) return;
            clearReconnectTimer();
            sessionTerminated = false;

            if (peer) {
                try { peer.destroy(); } catch (error) { }
                peer = null;
            }

            const name = sanitizeName(elements.nameInput.value || 'Player');
            const thisPeer = new Peer(roomId, { token: localPlayerToken, name, settings: buildSettings() });
            peer = thisPeer;

            thisPeer.on('open', (id) => {
                if (peer !== thisPeer) return;
                localPeerId = id;
                elements.leaveRoomBtn.disabled = false;
            });

            // The Durable Object owns the game. We only adopt the authoritative
            // state it broadcasts. Every participant is equal (no host).
            thisPeer.on('game-state', ({ state: nextState, serverNow, lastAction, presence }) => {
                if (peer !== thisPeer) return;
                handleGameState(nextState, serverNow, lastAction);
                if (Array.isArray(presence)) {
                    presence.forEach((p) => {
                        if (!p || !p.messageKey) return;
                        // A setting-change toast carries `by` (actor token); skip
                        // showing it to the person who made the change.
                        if (p.by && p.by === localPeerId) return;
                        showPresenceToast(i18n(p.messageKey, p.messageArg));
                    });
                }
            });

            thisPeer.on('roster', () => {
                if (peer !== thisPeer) return;
                applyRole();
            });

            // A rejected intent: undo any optimistic UI and surface the reason.
            // The server sends an i18n CODE; localize it here.
            thisPeer.on('notice', ({ message }) => {
                if (peer !== thisPeer) return;
                clearPendingMove();
                clearLocalOptimisticRequests();
                render();
                if (message) showToast(i18n(message));
            });

            thisPeer.on('close', () => {
                if (peer !== thisPeer) return;
                if (sessionTerminated) return;
                setConnectionLabel(i18n('msgRoomSyncing'));
                scheduleReconnect(800);
                render();
            });

            thisPeer.on('error', (error) => {
                if (peer !== thisPeer) return;
                if (error && error.type === 'network') {
                    setConnectionLabel(i18n('msgRoomSyncing'));
                    return; // the 'close' event will drive the reconnect.
                }
                showToast(`Error: ${(error && (error.type || error.message)) || 'unknown'}`);
            });

            thisPeer.on('displaced', () => {
                if (peer !== thisPeer) return;
                sessionTerminated = true;
                clearReconnectTimer();
                showToast(i18n('msgSessionReplaced'));
                closeLocalSessionWithoutSnapshot();
            });

            thisPeer.on('protocol-mismatch', () => {
                if (peer !== thisPeer) return;
                sessionTerminated = true;
                clearReconnectTimer();
                window.location.reload();
            });
        }

        // No host/admin role: every participant is equal. localMode only tracks
        // idle (lobby) vs in-room. All authority is in the Durable Object.
        function applyRole() {
            if (!peer) return;
            localMode = 'guest';
            elements.leaveRoomBtn.disabled = false;
            render();
        }

        // Adopt the authoritative state the Durable Object broadcasts on every
        // change. This replaces the old host-broadcast / guest-receive split:
        // everyone (including the admin) just renders what the server sends.
        function handleGameState(nextState, serverNow, lastAction) {
            if (!nextState || typeof nextState !== 'object') return;
            const incomingVersion = nextState.version || 0;
            const currentVersion = state?.version || 0;
            const currentMoveCount = state?.moves?.length || 0;
            const incomingMoves = Array.isArray(nextState.moves) ? nextState.moves : [];
            const shouldHighlightIncomingMove = Boolean(
                state &&
                incomingVersion &&
                incomingVersion > currentVersion &&
                incomingMoves.length > currentMoveCount
            );
            // Ignore a stale/out-of-order broadcast (shouldn't happen over one
            // ordered socket, but cheap to guard).
            if (incomingVersion && currentVersion && incomingVersion < currentVersion) {
                return;
            }
            // Align our wall clock to the server's so clock interpolation in
            // getDisplayRemainingMs uses authoritative (DO) time.
            if (typeof serverNow === 'number' && serverNow > 0) {
                clockOffsetMs = serverNow - Date.now();
            }
            if (peer) localMode = 'guest';
            const previousState = state;
            state = nextState;
            ensurePairRenjuState();
            refreshLocalizedResultText();
            clearPendingMove();
            clearConfirmMovePoint();
            if (shouldHighlightIncomingMove) {
                startLastMoveHighlight(incomingMoves[incomingMoves.length - 1]);
            }
            reactToStateChange(previousState, state, lastAction);
            elements.leaveRoomBtn.disabled = false;
            roomId = state.roomId || roomId;
            setConnectionLabel(i18n('msgRoomConnected'));
            if (displayMoveCount !== -1) {
                const currentMax = getRenderedMoves().length;
                if (displayMoveCount > currentMax) displayMoveCount = -1;
            }
            render();
        }

        // Client-side feedback the Durable Object can't produce: stone sound for
        // an opponent's placement, swap/draw/takeback notification sounds, and an
        // orange highlight on the (re)played stone. Driven by the state diff plus
        // the lastAction hint (kind + actor) the server attaches to broadcasts.
        function reactToStateChange(prev, next, lastAction) {
            if (!prev || !next) return; // first state load: no reactions
            const prevMoves = prev.moves?.length || 0;
            const nextMoves = next.moves?.length || 0;
            const lastMove = next.moves?.[nextMoves - 1];

            if (nextMoves > prevMoves && lastMove && lastMove.peerId !== localPeerId) {
                playStoneSound(false);
            }

            // swap / draw / takeback notifications fire on the seated opponent:
            // swap also flashes a whole-board orange alert (mirrors v1).
            const kind = lastAction && lastAction.kind;
            if (kind && isActiveActionNotification(kind)
                && shouldNotifyRemoteAction(lastAction.actorPeerId, kind)) {
                if (kind === 'swap') startBoardAlertHighlight('swap');
                playActionNotificationSound();
            }
        }

        function formatTime(ms) {
            const safe = Math.max(0, ms);
            const minutes = Math.floor(safe / 60000);
            const seconds = Math.floor((safe % 60000) / 1000);

        const TIME_LOW_MS = 10000;

        // Colour the clock as it runs down (amber → red).
        function updateTimerUrgency(element, peerId) {

            element.classList.toggle('time-low', playing && remaining <= TIME_LOW_MS && remaining > TIME_CRITICAL_MS);

        function getDisplayRemainingMs(peerId) {
            if (!state || !peerId) return 0;
            const clockKey = getClockKeyForPeer(peerId);
            const base = state.clocks.remainingMsByPeerId[clockKey] ?? state.config.baseSeconds * 1000;
            const sameActiveClock = getClockKeyForPeer(state.clocks.activePeerId) === clockKey;
            if (state.status !== 'playing' || !sameActiveClock || !state.clocks.activeStartedAt) {
                return base;
            }
            // activeStartedAt is in host time; align our clock to it. On the host
            // clockOffsetMs is 0, so this is a no-op there.
            return Math.max(0, base - ((Date.now() + clockOffsetMs) - state.clocks.activeStartedAt));

            if (state?.pairRenjuEnabled && kind === 'takeback') {

            return Boolean(

        function stepTimeInput(button) {
            const input = document.getElementById(button.dataset.stepTarget);
            if (!input || input.disabled) return;
            const candidates = input.id.includes('Increment')
                ? INCREMENT_SECOND_STEPS
                : BASE_MINUTE_STEPS;
            const currentValue = Number(input.value);
            const isDecrease = Number(button.dataset.step) < 0;
            const nextValue = isDecrease
                ? [...candidates].reverse().find((value) => value < currentValue)
                : candidates.find((value) => value > currentValue);
            if (nextValue == null) return;
            input.value = String(nextValue);
            input.dispatchEvent(new Event('input', { bubbles: true }));
        }

        function clampTimeInput(input) {
            const min = Number(input.min);
            const max = Number(input.max);
            const fallback = Number.isFinite(min) ? min : 0;
            const rawValue = Number(input.value);
            const nextValue = clamp(
                Number.isFinite(rawValue) ? Math.round(rawValue) : fallback,
                Number.isFinite(min) ? min : rawValue,
                Number.isFinite(max) ? max : rawValue
            );
            input.value = String(nextValue);
            input.dispatchEvent(new Event('input', { bubbles: true }));
        }

        function readClockSettingInputs(baseInput, incrementInput) {
            const rawBaseMinutes = Number(baseInput.value);
            const rawIncrementSeconds = Number(incrementInput.value);
            const baseMinutes = clamp(Number.isFinite(rawBaseMinutes) && rawBaseMinutes > 0 ? rawBaseMinutes : DEFAULT_BASE_MINUTES, 1, 180);
            const incrementSeconds = clamp(Number.isFinite(rawIncrementSeconds) ? rawIncrementSeconds : DEFAULT_INCREMENT_SECONDS, 0, 60);
            baseInput.value = String(baseMinutes);
            incrementInput.value = String(incrementSeconds);
            return { baseSeconds: baseMinutes * 60, incrementSeconds };
        }

        function applyTimeSettingsDialog() {
            if (!state) return;
